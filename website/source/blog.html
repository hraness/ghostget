<!doctype html>
<html lang="en" data-hraness-theme="paper" data-palette="gruvbox">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f8f7f4" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#12100f" media="(prefers-color-scheme: dark)">
    <title>{{BLOG_PAGE_TITLE}}</title>
    <meta name="description" content="{{BLOG_PAGE_DESCRIPTION}}">
    <meta name="robots" content="{{BLOG_ROBOTS}}">
    <link rel="canonical" href="{{BLOG_CANONICAL_URL}}">
    <link rel="icon" href="/icon.png" type="image/png" sizes="32x32">
    <link rel="icon" href="/icon-96.png" type="image/png" sizes="96x96">
    <link rel="apple-touch-icon" href="/apple-icon.png" sizes="180x180">
    <link rel="stylesheet" href="{{CSS_ASSET}}">
    <link rel="sitemap" type="application/xml" href="/sitemap.xml">
    <link rel="alternate" type="application/atom+xml" title="GhostGet blog" href="{{BLOG_FEED_URL}}">
    {{MARKDOWN_ALTERNATE}}
    <meta property="og:type" content="{{BLOG_OG_TYPE}}">
    <meta property="og:site_name" content="GhostGet">
    <meta property="og:title" content="{{BLOG_PAGE_TITLE}}">
    <meta property="og:description" content="{{BLOG_PAGE_DESCRIPTION}}">
    <meta property="og:url" content="{{BLOG_CANONICAL_URL}}">
    <meta property="og:image" content="https://ghostget.com/og.png">
    <meta property="og:image:alt" content="{{GHOSTGET_SOCIAL_IMAGE_ALT}}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    {{BLOG_ARTICLE_META}}
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{BLOG_PAGE_TITLE}}">
    <meta name="twitter:description" content="{{BLOG_PAGE_DESCRIPTION}}">
    <meta name="twitter:image" content="https://ghostget.com/og.png">
    <meta name="twitter:image:alt" content="{{GHOSTGET_SOCIAL_IMAGE_ALT}}">
    <meta name="ghostget-posthog-host" content="{{POSTHOG_HOST}}">
    <meta name="ghostget-posthog-key" content="{{POSTHOG_KEY}}">
    <script type="application/ld+json">{{JSON_LD}}</script>
    <script type="module" src="{{ANALYTICS_ASSET}}"></script>
    <script type="module" src="{{FOIL_ASSET}}"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="topbar guide-topbar">
      <a aria-label="{{PORTFOLIO_NAME}} home" class="wordmark hraness-foil-text" data-foil="" href="/"><span aria-hidden="true" class="brand-mark hraness-foil-mark" data-foil=""><img alt="" class="hraness-foil-mark__image" decoding="async" height="20" src="/marks/wrench.svg" width="20" /><span aria-hidden="true" class="hraness-foil-mark__paint"></span></span> {{PORTFOLIO_NAME}}</a>
      <nav aria-label="Primary">
        <a href="/docs/tutorials/getting-started/">Install</a>
        <a href="/docs/reference/provider-capabilities/">Providers</a>
        <a href="/docs/">Docs</a>
        <a href="https://github.com/hraness/ghostget">GitHub <span aria-hidden="true">↗</span></a>
        <a href="https://account.hraness.com/">Account</a>
      </nav>
    </header>
    <main class="guide-main blog-main" id="main" tabindex="-1">
      {{BLOG_MAIN}}
    </main>
    <aside aria-label="GhostGet project information" class="site-disclosure">
      <p>GhostGet · MIT · <a href="{{GHOSTGET_REPOSITORY}}">Source on GitHub</a> · <a href="/about/">About</a> · <a href="/contact/">Contact</a> · <a href="/privacy/">Privacy</a> · <a href="/llms.txt">llms.txt</a></p>
    </aside>
    {{HRANESS_SITE_FOOTER}}
  </body>
</html>
