<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#0e1113">
    <title>Ghostget preview</title>
    <meta name="description" content="A static preview of Ghostget, the local CLI and TypeScript SDK that gives your AI agent named web actions.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://ghostget.com/">
    <link rel="icon" href="/icon.png" type="image/png" sizes="512x512">
    <link rel="apple-touch-icon" href="/apple-icon.png" sizes="180x180">
    <link rel="stylesheet" href="{{CSS_ASSET}}">
  </head>
  <body class="preview-body">
    <main class="preview-shell">
      <section aria-labelledby="preview-title" class="preview-card">
        <p class="preview-wordmark">Ghostget</p>
        <div class="preview-copy">
          <p class="preview-eyebrow">Read · archive · act</p>
          <h1 id="preview-title">Let your agent read pages, save media, and use your accounts through named actions.</h1>
          <p>
            Ghostget is a local CLI and TypeScript SDK. Each action returns only
            its result, and your agent never sees your logins.
          </p>
        </div>
        <ol aria-label="Ghostget capability flow" class="preview-flow">
          <li><span>01</span> Read</li>
          <li><span>02</span> Archive</li>
          <li><span>03</span> Act</li>
        </ol>
      </section>
    </main>
  </body>
</html>
