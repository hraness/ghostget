name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize owner release tag
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify immutable owner and public repository identity
        env:
          EXPECTED_ACTOR_ID: "894119"
          EXPECTED_REPOSITORY: "hraness/wrench"
          EXPECTED_REPOSITORY_ID: "1316443113"
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != push || \
                "$GITHUB_ACTOR_ID" != "$EXPECTED_ACTOR_ID" || \
                "$GITHUB_REPOSITORY" != "$EXPECTED_REPOSITORY" || \
                "$GITHUB_REPOSITORY_ID" != "$EXPECTED_REPOSITORY_ID" || \
                "$REF_PROTECTED" != true ]]; then
            echo "::error::Release requires an owner-created protected tag in the exact public repository"
            exit 1
          fi
          EXPECTED_ACTOR_ID="$EXPECTED_ACTOR_ID" \
            EXPECTED_REPOSITORY="$EXPECTED_REPOSITORY" \
            EXPECTED_REPOSITORY_ID="$EXPECTED_REPOSITORY_ID" node <<'NODE'
          const { readFileSync } = require("node:fs");
          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
          if (
            event.sender?.id !== Number(process.env.EXPECTED_ACTOR_ID)
            || event.sender?.type !== "User"
            || event.repository?.id !== Number(process.env.EXPECTED_REPOSITORY_ID)
            || event.repository?.full_name !== process.env.EXPECTED_REPOSITORY
            || event.repository?.visibility !== "public"
            || event.repository?.private !== false
            || event.repository?.default_branch !== "main"
          ) throw new Error("Tag-push sender or public repository identity is not the immutable release authority");
          NODE

  verify:
    name: Verify
    needs: authorize
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      verified_sha: ${{ steps.identity.outputs.sha }}
      verified_tag: ${{ steps.identity.outputs.tag }}
    steps:
      - name: Resolve release request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          EVENT_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "push" || "$EVENT_REF_TYPE" != "tag" || "$EVENT_REF" != "refs/tags/$EVENT_REF_NAME" ]]; then
            echo "::error::Release request is not one exact tag push"
            exit 1
          fi
          if [[ ! "$EVENT_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release request is not one stable semantic-version tag"
            exit 1
          fi
          if ! EVENT_REF_NAME="$EVENT_REF_NAME" node -e '
            const match = /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/u.exec(process.env.EVENT_REF_NAME ?? "");
            if (match === null || match.slice(1).some(part => BigInt(part) > BigInt(Number.MAX_SAFE_INTEGER))) process.exit(1);
          '; then
            echo "::error::Release request exceeds npm's supported semantic-version range"
            exit 1
          fi
          printf 'tag=%s\n' "$EVENT_REF_NAME" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: refs/tags/${{ steps.request.outputs.tag }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Pin npm
        run: |
          set -euo pipefail
          npm install --global npm@11.19.0 \
            --ignore-scripts \
            --registry=https://registry.npmjs.org
          test "$(npm --version)" = "11.19.0"
      - name: Verify release identity
        id: identity
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REQUESTED_TAG: ${{ steps.request.outputs.tag }}
        run: |
          set -euo pipefail
          authority_output="$(node --experimental-strip-types \
            ./scripts/release-ref-authority.ts release "$REQUESTED_TAG")"
          authority=()
          while IFS= read -r line; do authority+=("$line"); done < <(
            printf '%s\n' "$authority_output"
          )
          if [[ ${#authority[@]} -ne 3 || \
                ! "${authority[0]}" =~ ^sha=([a-f0-9]{40})$ ]]; then
            echo "::error::Release ref authority output is malformed"
            exit 1
          fi
          tag_commit="${BASH_REMATCH[1]}"
          if [[ "${authority[1]}" != "tag=$REQUESTED_TAG" || \
                ! "${authority[2]}" =~ ^main_sha=([a-f0-9]{40})$ ]]; then
            echo "::error::Release ref authority did not bind tag below protected current main"
            exit 1
          fi
          package_version="$(bun -e 'const value = await Bun.file("package.json").json(); if (typeof value.version !== "string") process.exit(1); process.stdout.write(value.version)')"
          if [[ ! "$package_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Package version $package_version is not a stable semantic version"
            exit 1
          fi
          if ! PACKAGE_VERSION="$package_version" node -e '
            const match = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/u.exec(process.env.PACKAGE_VERSION ?? "");
            if (match === null || match.slice(1).some(part => BigInt(part) > BigInt(Number.MAX_SAFE_INTEGER))) process.exit(1);
          '; then
            echo "::error::Package version $package_version exceeds npm's supported semantic-version range"
            exit 1
          fi
          expected_tag="v$package_version"
          if [[ "$REQUESTED_TAG" != "$expected_tag" ]]; then
            echo "::error::Tag $REQUESTED_TAG does not match package version $expected_tag"
            exit 1
          fi
          head_commit="$(git rev-parse --verify "HEAD^{commit}")"
          if [[ "$tag_commit" != "$head_commit" ]]; then
            echo "::error::Checked-out source $head_commit does not match tag commit $tag_commit"
            exit 1
          fi
          printf 'tag=%s\n' "$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$tag_commit" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - run: |
          generated_status="$(git status --porcelain --untracked-files=all -- dist bun.lock)"
          if [[ -n "$generated_status" ]]; then
            printf '%s\n' "$generated_status"
            exit 1
          fi
      - run: bun pm pack --dry-run --ignore-scripts
      - run: node --input-type=module -e 'await Promise.all(["./dist/index.js","./dist/client.js","./dist/beeper-client.js","./dist/apple-photos-client.js","./dist/whatsapp-client.js","./dist/omni-client.js","./dist/messaging.js"].map((path) => import(path)))'
      - name: Verify exact public npm delivery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          package_name="$(node -p 'require("./package.json").name')"
          package_version="$(node -p 'require("./package.json").version')"
          package_spec="$package_name@$package_version"
          source_directory="$RUNNER_TEMP/wrench-release-source"
          registry_directory="$RUNNER_TEMP/wrench-release-registry"
          source_json="$RUNNER_TEMP/wrench-release-source.json"
          registry_json="$RUNNER_TEMP/wrench-release-registry.json"
          registry_view_json="$RUNNER_TEMP/wrench-release-registry-view.json"
          mkdir -p "$source_directory" "$registry_directory"

          npm pack \
            --ignore-scripts \
            --json \
            --pack-destination "$source_directory" \
            --registry=https://registry.npmjs.org > "$source_json"
          npm pack "$package_spec" \
            --ignore-scripts \
            --json \
            --pack-destination "$registry_directory" \
            --registry=https://registry.npmjs.org > "$registry_json"
          npm view "$package_spec" name version dist \
            --json \
            --registry=https://registry.npmjs.org > "$registry_view_json"
          latest_version="$(npm view "$package_name" dist-tags.latest \
            --json \
            --registry=https://registry.npmjs.org)"
          if [[ "$latest_version" != "\"$package_version\"" ]]; then
            echo "::error::npm latest is $latest_version, expected $package_version"
            exit 1
          fi

          source_name="$(node -e 'const fs = require("node:fs"); const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (!Array.isArray(value) || value.length !== 1 || typeof value[0].filename !== "string") process.exit(1); process.stdout.write(value[0].filename)' "$source_json")"
          registry_name="$(node -e 'const fs = require("node:fs"); const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (!Array.isArray(value) || value.length !== 1 || typeof value[0].filename !== "string") process.exit(1); process.stdout.write(value[0].filename)' "$registry_json")"
          if [[ "$source_name" != "$registry_name" ]]; then
            echo "::error::Source tarball $source_name does not match registry tarball $registry_name"
            exit 1
          fi
          source_archive="$source_directory/$source_name"
          registry_archive="$registry_directory/$registry_name"
          bun run ./scripts/npm-package-identity.ts \
            --source-archive "$source_archive" \
            --source-pack-json "$source_json" \
            --registry-archive "$registry_archive" \
            --registry-pack-json "$registry_json" \
            --registry-view-json "$registry_view_json" \
            --expected-name "$package_name" \
            --expected-version "$package_version"
          audit_directory="$RUNNER_TEMP/wrench-release-signature-audit"
          audit_json="$RUNNER_TEMP/wrench-release-signature-audit.json"
          mkdir -p "$audit_directory"
          AUDIT_DIRECTORY="$audit_directory" \
            PACKAGE_NAME="$package_name" \
            PACKAGE_VERSION="$package_version" node <<'NODE'
          const { writeFileSync } = require("node:fs");
          const { join } = require("node:path");
          writeFileSync(join(process.env.AUDIT_DIRECTORY, "package.json"), `${JSON.stringify({
            name: "wrench-release-signature-audit",
            private: true,
            version: "0.0.0",
            dependencies: { [process.env.PACKAGE_NAME]: process.env.PACKAGE_VERSION },
          })}\n`, { encoding: "utf8", mode: 0o600 });
          NODE
          npm install \
            --prefix "$audit_directory" \
            --ignore-scripts \
            --omit=dev \
            --omit=optional \
            --no-audit \
            --no-fund \
            --registry=https://registry.npmjs.org
          npm audit signatures \
            --prefix "$audit_directory" \
            --json \
            --include-attestations \
            --omit=dev \
            --omit=optional \
            --registry=https://registry.npmjs.org \
            > "$audit_json"
          provenance_identity="$(bun run ./scripts/npm-provenance-identity.ts \
            --audit-json "$audit_json" \
            --expected-event workflow_dispatch \
            --expected-name "$package_name" \
            --expected-owner-id 307125679 \
            --expected-ref refs/heads/main \
            --expected-repository hraness/wrench \
            --expected-repository-id 1316443113 \
            --expected-source-sha "$GITHUB_SHA" \
            --expected-version "$package_version" \
            --expected-workflow-path .github/workflows/npm-stage.yml \
            --registry-archive "$registry_archive")"
          read -r stage_run_id stage_run_attempt < <(PROVENANCE_IDENTITY="$provenance_identity" node <<'NODE'
          const identity = JSON.parse(process.env.PROVENANCE_IDENTITY ?? "null");
          if (
            !Number.isSafeInteger(identity?.runId)
            || identity.runId < 1
            || !Number.isSafeInteger(identity?.runAttempt)
            || identity.runAttempt < 1
            || Object.keys(identity).sort().join(",") !== "runAttempt,runId"
          ) throw new Error("Verified npm provenance returned an invalid run identity");
          process.stdout.write(`${identity.runId} ${identity.runAttempt}\n`);
          NODE
          )
          stage_attempt_json="$(mktemp "$RUNNER_TEMP/wrench-published-stage-attempt.XXXXXX")"
          stage_jobs_json="$(mktemp "$RUNNER_TEMP/wrench-published-stage-jobs.XXXXXX")"
          stage_workflow_json="$(mktemp "$RUNNER_TEMP/wrench-published-stage-workflow.XXXXXX")"
          repository_json="$(mktemp "$RUNNER_TEMP/wrench-published-stage-repository.XXXXXX")"
          trap 'rm -f "$stage_attempt_json" "$stage_jobs_json" "$stage_workflow_json" "$repository_json"' EXIT
          gh api --method GET \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$stage_run_id/attempts/$stage_run_attempt" \
            > "$stage_attempt_json"
          gh api --method GET \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$stage_run_id/attempts/$stage_run_attempt/jobs?per_page=100" \
            > "$stage_jobs_json"
          gh api --method GET \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/344213783" \
            > "$stage_workflow_json"
          gh api --method GET "/repos/$GITHUB_REPOSITORY" > "$repository_json"
          ATTEMPT_JSON="$stage_attempt_json" \
            JOBS_JSON="$stage_jobs_json" \
            EXPECTED_RUN_ATTEMPT="$stage_run_attempt" \
            EXPECTED_RUN_ID="$stage_run_id" \
            EXPECTED_SHA="$GITHUB_SHA" \
            EXPECTED_VERSION="$package_version" \
            REPOSITORY_JSON="$repository_json" \
            WORKFLOW_JSON="$stage_workflow_json" node <<'NODE'
          const fs = require("node:fs");
          const attempt = JSON.parse(fs.readFileSync(process.env.ATTEMPT_JSON, "utf8"));
          const jobsResponse = JSON.parse(fs.readFileSync(process.env.JOBS_JSON, "utf8"));
          const workflow = JSON.parse(fs.readFileSync(process.env.WORKFLOW_JSON, "utf8"));
          const repository = JSON.parse(fs.readFileSync(process.env.REPOSITORY_JSON, "utf8"));
          const runId = Number(process.env.EXPECTED_RUN_ID);
          const runAttempt = Number(process.env.EXPECTED_RUN_ATTEMPT);
          if (
            !Number.isSafeInteger(runId)
            || !Number.isSafeInteger(runAttempt)
            || attempt.id !== runId
            || attempt.run_attempt !== runAttempt
            || attempt.workflow_id !== 344213783
            || attempt.name !== "Stage npm package"
            || attempt.path !== ".github/workflows/npm-stage.yml"
            || attempt.event !== "workflow_dispatch"
            || attempt.head_branch !== "main"
            || attempt.head_sha !== process.env.EXPECTED_SHA
            || attempt.status !== "completed"
            || attempt.conclusion !== "success"
            || attempt.actor?.id !== 894119
            || attempt.actor?.type !== "User"
            || attempt.triggering_actor?.id !== 894119
            || attempt.triggering_actor?.type !== "User"
            || attempt.repository?.id !== 1316443113
            || attempt.repository?.full_name !== "hraness/wrench"
            || attempt.repository?.private !== false
            || workflow.id !== 344213783
            || workflow.name !== "Stage npm package"
            || workflow.path !== ".github/workflows/npm-stage.yml"
            || workflow.state !== "active"
            || repository.id !== 1316443113
            || repository.full_name !== "hraness/wrench"
            || repository.visibility !== "public"
            || repository.private !== false
            || repository.default_branch !== "main"
          ) throw new Error("Published npm provenance is not bound to the completed owner-authorized Wrench stage attempt");
          if (
            !Number.isSafeInteger(jobsResponse?.total_count)
            || jobsResponse.total_count < 1
            || jobsResponse.total_count > 100
            || !Array.isArray(jobsResponse.jobs)
            || jobsResponse.jobs.length !== jobsResponse.total_count
          ) throw new Error("Published npm provenance stage-attempt jobs are not one bounded complete response");
          const expectedJobName = `Stage exact package v${process.env.EXPECTED_VERSION}`;
          let exactSuccessfulStageJobs = 0;
          const jobIds = new Set();
          for (const job of jobsResponse.jobs) {
            if (
              !Number.isSafeInteger(job?.id)
              || job.id < 1
              || jobIds.has(job.id)
              || job.run_id !== runId
              || job.run_attempt !== runAttempt
              || job.head_sha !== process.env.EXPECTED_SHA
              || typeof job.name !== "string"
              || typeof job.status !== "string"
              || (job.conclusion !== null && typeof job.conclusion !== "string")
              || !Array.isArray(job.steps)
              || job.steps.length > 100
              || job.steps.some(step => (
                !step
                || typeof step !== "object"
                || typeof step.name !== "string"
                || (step.conclusion !== null && typeof step.conclusion !== "string")
              ))
            ) throw new Error("Published npm provenance stage-attempt job identity is malformed");
            jobIds.add(job.id);
            if (
              job.name === expectedJobName
              && job.status === "completed"
              && job.conclusion === "success"
            ) {
              const successfulIntents = job.steps.filter(step => (
                step.name === "Record exclusive stable-stage intent"
                && step.conclusion === "success"
              ));
              if (successfulIntents.length !== 1) {
                throw new Error("Published npm provenance stage job lacks one exact successful stable-stage intent");
              }
              exactSuccessfulStageJobs += 1;
            }
          }
          if (exactSuccessfulStageJobs !== 1) {
            throw new Error("Published npm provenance does not bind exactly one successful versioned stage job");
          }
          NODE
          bun run ./scripts/package-smoke.ts \
            --archive "$registry_archive" \
            --pack-json "$registry_json"

  publish:
    name: Publish immutable GitHub Release
    needs: verify
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
      VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
    steps:
      - name: Reauthorize current release attempt
        env:
          EXPECTED_ACTOR_ID: "894119"
          EXPECTED_REPOSITORY: "hraness/wrench"
          EXPECTED_REPOSITORY_ID: "1316443113"
          EXPECTED_WORKFLOW_ID: "323493609"
          EXPECTED_WORKFLOW_NAME: "Release"
          EXPECTED_WORKFLOW_PATH: ".github/workflows/release.yml"
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ || \
                ! "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ || \
                ! "$VERIFIED_SHA" =~ ^[a-f0-9]{40}$ || \
                ! "$VERIFIED_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ || \
                "$GITHUB_EVENT_NAME" != push || \
                "$GITHUB_REPOSITORY" != "$EXPECTED_REPOSITORY" || \
                "$GITHUB_REPOSITORY_ID" != "$EXPECTED_REPOSITORY_ID" || \
                "$GITHUB_REF" != "refs/tags/$VERIFIED_TAG" || \
                "$GITHUB_SHA" != "$VERIFIED_SHA" ]]; then
            echo "::error::Current release attempt is not the exact protected tag run"
            exit 1
          fi
          if ! VERIFIED_TAG="$VERIFIED_TAG" node -e '
            const value = process.env.VERIFIED_TAG ?? "";
            const match = /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/u.exec(value);
            if (match === null || match.slice(1).some(part => BigInt(part) > BigInt(Number.MAX_SAFE_INTEGER))) process.exit(1);
          '; then
            echo "::error::Current release attempt has an unsupported stable version"
            exit 1
          fi
          attempt_json="$(mktemp "$RUNNER_TEMP/wrench-release-attempt.XXXXXX")"
          workflow_json="$(mktemp "$RUNNER_TEMP/wrench-release-workflow.XXXXXX")"
          repository_json="$(mktemp "$RUNNER_TEMP/wrench-release-repository.XXXXXX")"
          tag_ref_json="$(mktemp "$RUNNER_TEMP/wrench-release-tag-ref.XXXXXX")"
          trap 'rm -f "$attempt_json" "$workflow_json" "$repository_json" "$tag_ref_json"' EXIT
          gh api --method GET \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
            > "$attempt_json"
          gh api --method GET \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/$EXPECTED_WORKFLOW_ID" \
            > "$workflow_json"
          gh api --method GET "/repos/$GITHUB_REPOSITORY" > "$repository_json"
          ATTEMPT_JSON="$attempt_json" \
            WORKFLOW_JSON="$workflow_json" \
            REPOSITORY_JSON="$repository_json" \
            EXPECTED_ACTOR_ID="$EXPECTED_ACTOR_ID" \
            EXPECTED_REPOSITORY="$EXPECTED_REPOSITORY" \
            EXPECTED_REPOSITORY_ID="$EXPECTED_REPOSITORY_ID" \
            EXPECTED_RUN_ID="$GITHUB_RUN_ID" \
            EXPECTED_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            EXPECTED_SHA="$VERIFIED_SHA" \
            EXPECTED_TAG="$VERIFIED_TAG" \
            EXPECTED_WORKFLOW_ID="$EXPECTED_WORKFLOW_ID" \
            EXPECTED_WORKFLOW_NAME="$EXPECTED_WORKFLOW_NAME" \
            EXPECTED_WORKFLOW_PATH="$EXPECTED_WORKFLOW_PATH" node <<'NODE'
          const { readFileSync } = require("node:fs");
          const positiveInteger = (name) => {
            const value = process.env[name] ?? "";
            if (!/^[1-9][0-9]*$/u.test(value)) throw new Error(`Invalid ${name}`);
            const number = Number(value);
            if (!Number.isSafeInteger(number)) throw new Error(`Unsafe ${name}`);
            return number;
          };
          const attempt = JSON.parse(readFileSync(process.env.ATTEMPT_JSON, "utf8"));
          const workflow = JSON.parse(readFileSync(process.env.WORKFLOW_JSON, "utf8"));
          const repository = JSON.parse(readFileSync(process.env.REPOSITORY_JSON, "utf8"));
          const actorId = positiveInteger("EXPECTED_ACTOR_ID");
          const repositoryId = positiveInteger("EXPECTED_REPOSITORY_ID");
          const runId = positiveInteger("EXPECTED_RUN_ID");
          const runAttempt = positiveInteger("EXPECTED_RUN_ATTEMPT");
          const workflowId = positiveInteger("EXPECTED_WORKFLOW_ID");
          if (
            attempt.id !== runId
            || attempt.run_attempt !== runAttempt
            || attempt.workflow_id !== workflowId
            || attempt.name !== process.env.EXPECTED_WORKFLOW_NAME
            || attempt.path !== process.env.EXPECTED_WORKFLOW_PATH
            || attempt.event !== "push"
            || attempt.head_branch !== process.env.EXPECTED_TAG
            || attempt.head_sha !== process.env.EXPECTED_SHA
            || attempt.status !== "in_progress"
            || attempt.conclusion !== null
            || attempt.actor?.id !== actorId
            || attempt.actor?.type !== "User"
            || attempt.triggering_actor?.id !== actorId
            || attempt.triggering_actor?.type !== "User"
            || attempt.repository?.id !== repositoryId
            || attempt.repository?.full_name !== process.env.EXPECTED_REPOSITORY
            || attempt.repository?.private !== false
            || workflow.id !== workflowId
            || workflow.name !== process.env.EXPECTED_WORKFLOW_NAME
            || workflow.path !== process.env.EXPECTED_WORKFLOW_PATH
            || workflow.state !== "active"
            || repository.id !== repositoryId
            || repository.full_name !== process.env.EXPECTED_REPOSITORY
            || repository.visibility !== "public"
            || repository.private !== false
            || repository.default_branch !== "main"
          ) throw new Error("Current release attempt is not owner-authorized for this exact public workflow");
          NODE
          gh api --method GET "/repos/$GITHUB_REPOSITORY/git/ref/tags/$VERIFIED_TAG" \
            > "$tag_ref_json"
          TAG_REF_JSON="$tag_ref_json" EXPECTED_SHA="$VERIFIED_SHA" node -e '
            const value = JSON.parse(require("node:fs").readFileSync(process.env.TAG_REF_JSON, "utf8"));
            if (value?.object?.type !== "commit" || value.object.sha !== process.env.EXPECTED_SHA) process.exit(1);
          '
          current_default_sha="$(gh api --method GET --jq '.sha' \
            "/repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH")"
          if [[ ! "$current_default_sha" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Current protected main identity is malformed"
            exit 1
          fi
          comparison_status="$(gh api --method GET --jq '.status' \
            "/repos/$GITHUB_REPOSITORY/compare/$VERIFIED_SHA...$current_default_sha")"
          if [[ "$comparison_status" != ahead && "$comparison_status" != identical ]]; then
            echo "::error::Tag $VERIFIED_TAG is no longer reachable from $DEFAULT_BRANCH"
            exit 1
          fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ needs.verify.outputs.verified_sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Pin npm
        run: |
          set -euo pipefail
          npm install --global npm@11.19.0 \
            --ignore-scripts \
            --registry=https://registry.npmjs.org
          test "$(npm --version)" = "11.19.0"
      - name: Publish verified GitHub Release
        run: |
          set -euo pipefail
          if [[ ! "$VERIFIED_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Publish request has no verified stable release tag"
            exit 1
          fi
          if ! VERIFIED_TAG="$VERIFIED_TAG" node -e '
            const value = process.env.VERIFIED_TAG ?? "";
            const match = /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/u.exec(value);
            if (match === null || match.slice(1).some(part => BigInt(part) > BigInt(Number.MAX_SAFE_INTEGER))) process.exit(1);
          '; then
            echo "::error::Publish request has an unsupported stable release version"
            exit 1
          fi
          if [[ ! "$VERIFIED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Publish request has no verified release commit"
            exit 1
          fi
          remote_tag_sha="$(gh api "/repos/$GITHUB_REPOSITORY/commits/refs%2Ftags%2F$VERIFIED_TAG" --jq '.sha')"
          current_main_sha="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" --jq '.object.sha')"
          if [[ "$remote_tag_sha" != "$VERIFIED_SHA" || ! "$current_main_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Remote tag or current main authority is malformed"
            exit 1
          fi
          verify_publication_authority() {
            local actual expected expected_main phase
            phase="$1"
            expected_main="$2"
            actual="$(node --experimental-strip-types \
              ./scripts/release-ref-authority.ts "publication-$phase" \
              "$VERIFIED_TAG" "$VERIFIED_SHA" "$expected_main")"
            expected="$(printf 'sha=%s\ntag=%s\nmain_sha=%s' \
              "$VERIFIED_SHA" "$VERIFIED_TAG" "$expected_main")"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::Publication authority output is malformed"
              exit 1
            fi
          }
          release_endpoint="/repos/$GITHUB_REPOSITORY/releases/tags/$VERIFIED_TAG"
          release_lookup_stderr="$(mktemp)"
          predecessor_release_file="$(mktemp)"
          created_release_file="$(mktemp)"
          npm_latest_file="$(mktemp)"
          npm_directory="$RUNNER_TEMP/wrench-release-npm"
          npm_user_config="$RUNNER_TEMP/wrench-release-userconfig"
          npm_global_config="$RUNNER_TEMP/wrench-release-globalconfig"
          mkdir -p "$npm_directory"
          : > "$npm_user_config"
          : > "$npm_global_config"
          chmod 600 "$npm_user_config" "$npm_global_config"
          trap 'rm -f "$release_lookup_stderr" "$predecessor_release_file" "$created_release_file" "$npm_latest_file" "$npm_user_config" "$npm_global_config"' EXIT
          set +e
          release_lookup="$(gh api --include "$release_endpoint" 2>"$release_lookup_stderr")"
          release_lookup_exit="$?"
          set -e
          release_lookup_state="$(printf '%s' "$release_lookup" | \
            node ./scripts/release-provider-outcome.mjs inspect-release-response)"
          case "$release_lookup_state" in
            found)
              if [[ "$release_lookup_exit" -ne 0 ]]; then
                echo "::error::Exact Release lookup returned a Release with exit $release_lookup_exit"
                exit 1
              fi
              ;;
            missing)
              if [[ "$release_lookup_exit" -ne 1 ]]; then
                echo "::error::Exact Release absence returned unexpected exit $release_lookup_exit"
                exit 1
              fi
              ;;
            *)
              echo "::error::Exact Release lookup returned an unsupported state"
              exit 1
              ;;
          esac
          RELEASE_LOOKUP_STATE="$release_lookup_state" \
            node ./scripts/release-provider-outcome.mjs release-order
          if [[ "$release_lookup_state" == "missing" ]]; then
            gh api "/repos/$GITHUB_REPOSITORY/releases/latest" > "$predecessor_release_file"
            node ./scripts/release-provider-outcome.mjs \
              validate-latest-predecessor < "$predecessor_release_file"
            current_main_sha="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" --jq '.object.sha')"
            remote_tag_sha="$(gh api "/repos/$GITHUB_REPOSITORY/commits/refs%2Ftags%2F$VERIFIED_TAG" --jq '.sha')"
            if [[ ! "$current_main_sha" =~ ^[0-9a-f]{40}$ || "$remote_tag_sha" != "$VERIFIED_SHA" ]]; then
              echo "::error::Release authority moved before publication"
              exit 1
            fi
            verify_publication_authority prewrite "$current_main_sha"
          fi
          unset NPM_CONFIG_TAG npm_config_tag
          configured_tag="$(cd "$npm_directory" && \
            NPM_CONFIG_USERCONFIG="$npm_user_config" \
            NPM_CONFIG_GLOBALCONFIG="$npm_global_config" \
            npm config get tag)"
          if [[ "$configured_tag" != latest ]]; then
            echo "::error::Pinned npm does not have the clean default publication tag latest"
            exit 1
          fi
          (cd "$npm_directory" && \
            NPM_CONFIG_USERCONFIG="$npm_user_config" \
            NPM_CONFIG_GLOBALCONFIG="$npm_global_config" \
            npm view @hraness/wrench dist-tags.latest --json \
              --registry=https://registry.npmjs.org) > "$npm_latest_file"
          NPM_LATEST_JSON="$npm_latest_file" VERIFIED_TAG="$VERIFIED_TAG" node <<'NODE'
          const { readFileSync } = require("node:fs");
          const latest = JSON.parse(readFileSync(process.env.NPM_LATEST_JSON, "utf8"));
          const match = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/u.exec(latest ?? "");
          if (
            match === null
            || match.slice(1).some(part => BigInt(part) > BigInt(Number.MAX_SAFE_INTEGER))
            || `v${latest}` !== process.env.VERIFIED_TAG
          ) throw new Error("Canonical npm latest is not the exact verified release version");
          NODE
          if [[ "$release_lookup_state" == "missing" ]]; then
            release_receipt="$(node ./scripts/release-provider-outcome.mjs release-source-receipt)"
            created_release="$(gh api \
              --method POST \
              "/repos/$GITHUB_REPOSITORY/releases" \
              -f body="$release_receipt" \
              -F draft=false \
              -F generate_release_notes=true \
              -f make_latest=legacy \
              -f name="Wrench $VERIFIED_TAG" \
              -F prerelease=false \
              -f tag_name="$VERIFIED_TAG" \
              -f target_commitish="$VERIFIED_SHA")"
            printf '%s' "$created_release" > "$created_release_file"
            node ./scripts/release-provider-outcome.mjs \
              validate-release < "$created_release_file"
          fi
          release_readback="$(gh api "$release_endpoint")"
          printf '%s' "$release_readback" | \
            node ./scripts/release-provider-outcome.mjs validate-release
          if [[ "$release_lookup_state" == "missing" ]]; then
            printf '%s' "$release_readback" | \
              node ./scripts/release-provider-outcome.mjs \
                validate-created-release "$created_release_file"
            printf '%s' "$release_readback" | \
              node ./scripts/release-provider-outcome.mjs \
                wait-latest-release "$predecessor_release_file"
          else
            printf '%s' "$release_readback" | \
              node ./scripts/release-provider-outcome.mjs require-latest-release
          fi
          terminal_tag_sha="$(gh api "/repos/$GITHUB_REPOSITORY/commits/refs%2Ftags%2F$VERIFIED_TAG" --jq '.sha')"
          terminal_main_sha="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" --jq '.object.sha')"
          verify_publication_authority postwrite "$terminal_main_sha"
          if [[ "$terminal_tag_sha" != "$VERIFIED_SHA" ]]; then
            echo "::error::Immutable release tag moved during publication"
            exit 1
          fi
          printf '%s' "$release_readback" | \
            node ./scripts/release-provider-outcome.mjs revalidate-latest-release
