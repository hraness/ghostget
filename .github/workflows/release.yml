          if (
            manifest?.name !== "@hraness/ghostget"
            || manifest?.version !== process.env.EXPECTED_VERSION
            || (Object.hasOwn(manifest, "private") && manifest.private !== false)
            || Object.hasOwn(manifest, "contentPolicy")
            || Object.hasOwn(manifest, "tag")
            || publishConfig === null
            || typeof publishConfig !== "object"
            || Array.isArray(publishConfig)
            || JSON.stringify(Object.keys(publishConfig).sort()) !== JSON.stringify(["access", "registry"])
            || publishConfig.access !== "public"
            || publishConfig.registry !== "https://registry.npmjs.org"
          ) throw new Error("Packed Ghostget can publish only to the canonical public npm registry");
          NODE
          expected_sha256="$(tr -d '\n' < "$sha256_file")"
          if [[ ! "$expected_sha256" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::Downloaded npm-package.sha256 is invalid"
            exit 1
          fi
          actual_sha256="$(sha256sum "$tarball" | awk '{ print $1 }')"
          if [[ "$actual_sha256" != "$expected_sha256" ]]; then
            echo "::error::Downloaded tarball does not match the verified SHA-256"
            exit 1
          fi
          printf 'sha256=%s\ntarball=%s\n' "$actual_sha256" "$tarball" >> "$GITHUB_OUTPUT"
      - name: Admit absent or exact public registry state
        id: registry
        env:
          EXPECTED_TARBALL_SHA256: ${{ steps.artifact.outputs.sha256 }}
          EXPECTED_VERSION: ${{ steps.canonical.outputs.version }}
          NPM_DIRECTORY: ${{ steps.npm_config.outputs.directory }}
          NPM_GLOBALCONFIG: ${{ steps.npm_config.outputs.globalconfig }}
          NPM_USERCONFIG: ${{ steps.npm_config.outputs.userconfig }}
          TARBALL: ${{ steps.artifact.outputs.tarball }}
        run: |
          set -euo pipefail
          unset NPM_CONFIG_TAG npm_config_tag
          if [[ "$(sha256sum "$TARBALL" | awk '{ print $1 }')" != "$EXPECTED_TARBALL_SHA256" ]]; then
            echo "::error::Handed-off tarball changed before registry admission"
            exit 1
          fi
          expected_integrity="$(TARBALL="$TARBALL" node -e 'process.stdout.write(`sha512-${require("node:crypto").createHash("sha512").update(require("node:fs").readFileSync(process.env.TARBALL)).digest("base64")}`)')"
          version_json="$(mktemp "$RUNNER_TEMP/ghostget-registry-version.XXXXXX")"
          version_error="$(mktemp "$RUNNER_TEMP/ghostget-registry-error.XXXXXX")"
          latest_json="$(mktemp "$RUNNER_TEMP/ghostget-registry-latest.XXXXXX")"
          trap 'rm -f "$version_json" "$version_error" "$latest_json"' EXIT
          cd "$NPM_DIRECTORY"
          if NPM_CONFIG_USERCONFIG="$NPM_USERCONFIG" NPM_CONFIG_GLOBALCONFIG="$NPM_GLOBALCONFIG" \
            npm view "@hraness/ghostget@$EXPECTED_VERSION" --json \
              --registry=https://registry.npmjs.org > "$version_json" 2> "$version_error"; then
            npm_state=published
          elif grep -q 'E404' "$version_error"; then
            npm_state=absent
          else
            cat "$version_error"
            echo "::error::Could not prove the public registry state of @hraness/ghostget@$EXPECTED_VERSION"
            exit 1
          fi
          NPM_CONFIG_USERCONFIG="$NPM_USERCONFIG" NPM_CONFIG_GLOBALCONFIG="$NPM_GLOBALCONFIG" \
            npm view @hraness/ghostget dist-tags.latest --json \
              --registry=https://registry.npmjs.org > "$latest_json"
          NPM_STATE="$npm_state" VERSION_JSON="$version_json" LATEST_JSON="$latest_json" \
            EXPECTED_INTEGRITY="$expected_integrity" node <<'NODE'
          const { readFileSync, appendFileSync } = require("node:fs");
          const parseStable = (value, label) => {
            if (typeof value !== "string") throw new Error(`${label} is not a string`);
            const match = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/u.exec(value);
            if (match === null || match.slice(1).some(part => BigInt(part) > BigInt(Number.MAX_SAFE_INTEGER))) throw new Error(`${label} is not a supported stable semantic version`);
            return match.slice(1).map(BigInt);
          };
          const expectedValue = process.env.EXPECTED_VERSION ?? "";
          const expected = parseStable(expectedValue, "Candidate version");
          const latestValue = JSON.parse(readFileSync(process.env.LATEST_JSON, "utf8"));
          const latest = parseStable(latestValue, "Public npm latest");
          const compare = (left, right) => { for (let i = 0; i < 3; i += 1) { if (left[i] !== right[i]) return left[i] > right[i] ? 1 : -1; } return 0; };
          if (process.env.NPM_STATE === "absent") {
            if (compare(expected, latest) <= 0) throw new Error(`Candidate ${expectedValue} is not newer than public npm latest ${latestValue}`);
            appendFileSync(process.env.GITHUB_OUTPUT, "npm_state=absent\n");
            console.log(`@hraness/ghostget@${expectedValue} is absent from the public registry; latest is ${latestValue}`);
          } else {
            const value = JSON.parse(readFileSync(process.env.VERSION_JSON, "utf8"));
            if (value === null || typeof value !== "object" || Array.isArray(value) || value.name !== "@hraness/ghostget" || value.version !== expectedValue
              || value.dist?.integrity !== process.env.EXPECTED_INTEGRITY || value.dist?.tarball !== `https://registry.npmjs.org/@hraness/ghostget/-/ghostget-${expectedValue}.tgz`) {
              throw new Error(`@hraness/ghostget@${expectedValue} is already public with different bytes; never overwrite a published version`);
            }
            if (compare(latest, expected) < 0) throw new Error(`Public npm latest ${latestValue} is older than the already published ${expectedValue}`);
            appendFileSync(process.env.GITHUB_OUTPUT, "npm_state=exact\n");
            console.log(`@hraness/ghostget@${expectedValue} is already public with the exact canonical bytes; nothing to publish`);
          }
          NODE
      - name: Publish exact canonical archive through npm trusted publishing
        id: npm_publish
        env:
          EXPECTED_ARCHIVE_SHA256: ${{ steps.canonical.outputs.archive_sha256 }}
          EXPECTED_RELEASE_ATTEMPT: ${{ steps.canonical.outputs.release_attempt }}
          EXPECTED_TARBALL_SHA256: ${{ steps.artifact.outputs.sha256 }}
          EXPECTED_VERSION: ${{ steps.canonical.outputs.version }}
          NPM_DIRECTORY: ${{ steps.npm_config.outputs.directory }}
          NPM_GLOBALCONFIG: ${{ steps.npm_config.outputs.globalconfig }}
          NPM_STATE: ${{ steps.registry.outputs.npm_state }}
          NPM_USERCONFIG: ${{ steps.npm_config.outputs.userconfig }}
          TARBALL: ${{ steps.artifact.outputs.tarball }}
        run: |
          set -euo pipefail
          unset NPM_CONFIG_TAG npm_config_tag
          if [[ "$GITHUB_REPOSITORY" != "hraness/ghostget" || "$DEFAULT_BRANCH" != "main" || "$GITHUB_REF" != "refs/tags/$VERIFIED_TAG" || "$GITHUB_SHA" != "$VERIFIED_SHA" ]]; then
            echo "::error::npm publication must run in the exact Ghostget release tag context"
            exit 1
          fi
          if [[ "$NPM_STATE" == exact ]]; then
            echo "Skipping npm publication: @hraness/ghostget@$EXPECTED_VERSION already carries the exact canonical bytes"
            printf 'published_identity=%s\n' "@hraness/ghostget@$EXPECTED_VERSION exact-prior-publication" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$NPM_STATE" != absent ]]; then
            echo "::error::Registry admission did not record an exact npm state"
            exit 1
          fi
          current_tarball_sha256="$(sha256sum "$TARBALL" | awk '{ print $1 }')"
          if [[ "$current_tarball_sha256" != "$EXPECTED_TARBALL_SHA256" || "$current_tarball_sha256" != "$EXPECTED_ARCHIVE_SHA256" ]]; then
            echo "::error::Handed-off tarball changed before npm publication"
            exit 1
          fi
          configured_tag="$(cd "$NPM_DIRECTORY" && \
            NPM_CONFIG_USERCONFIG="$NPM_USERCONFIG" \
            NPM_CONFIG_GLOBALCONFIG="$NPM_GLOBALCONFIG" \
            npm config get tag)"
          if [[ "$configured_tag" != latest ]]; then
            echo "::error::Clean npm publication default moved at the terminal publication boundary"
            exit 1
          fi
          canonical_release_json="$(mktemp "$RUNNER_TEMP/ghostget-terminal-canonical-release.XXXXXX")"
          publish_result="$(mktemp "$RUNNER_TEMP/ghostget-publish-result.XXXXXX")"
          trap 'rm -f "$canonical_release_json" "$publish_result"' EXIT
          gh api --method GET "/repos/$GITHUB_REPOSITORY/releases/tags/$VERIFIED_TAG" > "$canonical_release_json"
          CANONICAL_RELEASE_JSON="$canonical_release_json" node <<'NODE'
          const fs = require("node:fs");
          const release = JSON.parse(fs.readFileSync(process.env.CANONICAL_RELEASE_JSON, "utf8"));
          const version = process.env.EXPECTED_VERSION;
          const names = [`hraness-ghostget-${version}.tgz`, "npm-pack.json", "release-manifest.json", "SHA256SUMS", "provenance.jsonl"];
          const receipt = `wrench-release-source-v1 repository=hraness/ghostget tag=v${version} source_sha=${process.env.VERIFIED_SHA} workflow_run_id=${process.env.GITHUB_RUN_ID}`;
          const body = `${receipt}\n\nghostget-release-attempt-v1 run_attempt=${process.env.EXPECTED_RELEASE_ATTEMPT}`;
          if (!Number.isSafeInteger(release.id) || release.id < 1 || release.target_commitish !== process.env.VERIFIED_SHA
            || release.tag_name !== `v${version}` || release.draft !== false || release.prerelease !== false || release.immutable !== true
            || release.author?.id !== 41898282 || release.author?.type !== "Bot" || release.body !== body
            || !Array.isArray(release.assets) || release.assets.length !== 5) throw new Error("Immutable canonical Release is not the exact publication authority for npm");
          const seen = new Set();
          for (const asset of release.assets) {
            if (!names.includes(asset.name) || seen.has(asset.name) || asset.state !== "uploaded"
              || !/^sha256:[0-9a-f]{64}$/u.test(asset.digest ?? "")) throw new Error("Canonical asset inventory differs before npm publication");
            seen.add(asset.name);
          }
          const archive = release.assets.find(asset => asset.name === names[0]);
          if (archive.digest !== `sha256:${process.env.EXPECTED_TARBALL_SHA256}`
            || archive.size !== fs.statSync(process.env.TARBALL).size) throw new Error("npm package is not the exact canonical archive bytes");
          NODE
          (cd "$NPM_DIRECTORY" && \
            NPM_CONFIG_USERCONFIG="$NPM_USERCONFIG" \
            NPM_CONFIG_GLOBALCONFIG="$NPM_GLOBALCONFIG" \
            npm publish "$TARBALL" \
              --access public \
              --ignore-scripts \
              --json \
              --provenance \
              --registry=https://registry.npmjs.org) > "$publish_result"
          expected_integrity="$(TARBALL="$TARBALL" node -e 'process.stdout.write(`sha512-${require("node:crypto").createHash("sha512").update(require("node:fs").readFileSync(process.env.TARBALL)).digest("base64")}`)')"
          published_identity="$(PUBLISH_RESULT="$publish_result" EXPECTED_INTEGRITY="$expected_integrity" node <<'NODE'
          const { readFileSync } = require("node:fs");
          const output = JSON.parse(readFileSync(process.env.PUBLISH_RESULT, "utf8"));
          const expectedName = "@hraness/ghostget";
          if (
            output === null || typeof output !== "object" || Array.isArray(output)
            || output.name !== expectedName || output.version !== process.env.EXPECTED_VERSION
            || output.id !== `${expectedName}@${process.env.EXPECTED_VERSION}`
            || output.integrity !== process.env.EXPECTED_INTEGRITY
          ) throw new Error("npm did not return the one exact published Ghostget identity");
          process.stdout.write(`${output.id} ${output.integrity}`);
          NODE
          )"
          printf 'published_identity=%s\n' "$published_identity" >> "$GITHUB_OUTPUT"

  admit_npm:
    name: Admit exact public npm package
    needs: [verify, attest, publish_npm]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_ARTIFACT_HASHES: ${{ needs.verify.outputs.artifact_hashes }}
      NPM_STATE: ${{ needs.publish_npm.outputs.npm_state }}
      PUBLISHED_IDENTITY: ${{ needs.publish_npm.outputs.published_identity }}
      VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
      VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ needs.verify.outputs.verified_sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.20.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Pin npm
        run: |
          set -euo pipefail
          npm install --global npm@11.19.0 \
            --ignore-scripts \
            --registry=https://registry.npmjs.org
          test "$(npm --version)" = "11.19.0"
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.attest.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/ghostget-canonical
      - name: Verify the exact public registry package and its provenance
        env:
          CANONICAL_DIRECTORY: ${{ runner.temp }}/ghostget-canonical
        run: |
          set -euo pipefail
          if [[ "$NPM_STATE" != absent && "$NPM_STATE" != exact ]]; then
            echo "::error::npm publication did not record an exact registry state"
            exit 1
          fi
          if [[ "$GITHUB_REPOSITORY" != "hraness/ghostget" || "$GITHUB_REF" != "refs/tags/$VERIFIED_TAG" || "$GITHUB_SHA" != "$VERIFIED_SHA" || "$(git rev-parse --verify HEAD^{commit})" != "$VERIFIED_SHA" ]]; then
            echo "::error::npm admission must verify the exact release tag source"
            exit 1
          fi
          version="${VERIFIED_TAG#v}"
          archive_name="hraness-ghostget-$version.tgz"
          if [[ "$PUBLISHED_IDENTITY" != "@hraness/ghostget@$version "* ]]; then
            echo "::error::npm publication identity is not the exact package coordinate"
            exit 1
          fi
          expected_sha256="$(EXPECTED_ARTIFACT_HASHES="$EXPECTED_ARTIFACT_HASHES" ARCHIVE_NAME="$archive_name" node -e '
            const hashes = JSON.parse(process.env.EXPECTED_ARTIFACT_HASHES ?? "null");
            const value = hashes?.[process.env.ARCHIVE_NAME];
            if (typeof value !== "string" || !/^[a-f0-9]{64}$/u.test(value)) process.exit(1);
            process.stdout.write(value);
          ')"
          if [[ "$(sha256sum "$CANONICAL_DIRECTORY/$archive_name" | awk '{ print $1 }')" != "$expected_sha256" ]]; then
            echo "::error::Downloaded canonical archive does not match the verified build hash"
            exit 1
          fi
          registry_directory="$RUNNER_TEMP/ghostget-registry"
          mkdir -m 700 "$registry_directory"
          (cd "$registry_directory" && npm pack "@hraness/ghostget@$version" --ignore-scripts --json \
            --registry=https://registry.npmjs.org > npm-pack.json)
          npm view "@hraness/ghostget@$version" --json --registry=https://registry.npmjs.org > "$registry_directory/npm-view.json"
          bun run ./scripts/npm-package-identity.ts \
            --expected-name @hraness/ghostget \
            --expected-version "$version" \
            --registry-archive "$registry_directory/$archive_name" \
            --registry-pack-json "$registry_directory/npm-pack.json" \
            --registry-view-json "$registry_directory/npm-view.json" \
            --source-archive "$CANONICAL_DIRECTORY/$archive_name" \
            --source-pack-json "$CANONICAL_DIRECTORY/npm-pack.json"
          consumer_directory="$RUNNER_TEMP/ghostget-registry-consumer"
          mkdir -m 700 "$consumer_directory"
          (cd "$consumer_directory" \
            && printf '{ "name": "ghostget-registry-consumer", "version": "0.0.0", "private": true }\n' > package.json \
            && npm install "@hraness/ghostget@$version" --ignore-scripts --no-audit --no-fund \
              --registry=https://registry.npmjs.org \
            && npm audit signatures --json --include-attestations --omit=dev \
              --registry=https://registry.npmjs.org > npm-audit.json)
          bun run ./scripts/npm-provenance-identity.ts \
            --audit-json "$consumer_directory/npm-audit.json" \
            --expected-event push \
            --expected-name @hraness/ghostget \
            --expected-owner-id 307125679 \
            --expected-ref "refs/tags/$VERIFIED_TAG" \
            --expected-repository hraness/ghostget \
            --expected-repository-id 1316443113 \
            --expected-source-sha "$VERIFIED_SHA" \
            --expected-version "$version" \
            --expected-workflow-path .github/workflows/release.yml \
            --registry-archive "$registry_directory/$archive_name"
