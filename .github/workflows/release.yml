name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize owner release tag
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify immutable owner and public repository identity
        env:
          EXPECTED_ACTOR_ID: "894119"
          EXPECTED_REPOSITORY: "hraness/ghostget"
          EXPECTED_REPOSITORY_ID: "1316443113"
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != push || \
                "$GITHUB_ACTOR_ID" != "$EXPECTED_ACTOR_ID" || \
                "$GITHUB_REPOSITORY" != "$EXPECTED_REPOSITORY" || \
                "$GITHUB_REPOSITORY_ID" != "$EXPECTED_REPOSITORY_ID" || \
                "$REF_PROTECTED" != true ]]; then
            echo "::error::Release requires an owner-created protected tag in the exact public repository"
            exit 1
          fi
          EXPECTED_ACTOR_ID="$EXPECTED_ACTOR_ID" \
            EXPECTED_REPOSITORY="$EXPECTED_REPOSITORY" \
            EXPECTED_REPOSITORY_ID="$EXPECTED_REPOSITORY_ID" node <<'NODE'
          const { readFileSync } = require("node:fs");
          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
          if (
            event.sender?.id !== Number(process.env.EXPECTED_ACTOR_ID)
            || event.sender?.type !== "User"
            || event.repository?.id !== Number(process.env.EXPECTED_REPOSITORY_ID)
            || event.repository?.full_name !== process.env.EXPECTED_REPOSITORY
            || event.repository?.visibility !== "public"
            || event.repository?.private !== false
            || event.repository?.default_branch !== "main"
          ) throw new Error("Tag-push sender or public repository identity is not the immutable release authority");
          NODE

  verify:
    name: Verify
    needs: authorize
    permissions:
      actions: read
      contents: read
      checks: read
      pull-requests: read
      security-events: read
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      verified_sha: ${{ steps.identity.outputs.sha }}
      verified_tag: ${{ steps.identity.outputs.tag }}
      workflow_sha: ${{ steps.identity.outputs.main_sha }}
      archive_name: ${{ steps.identity.outputs.archive_name }}
      artifact_hashes: ${{ steps.canonical.outputs.artifact_hashes }}
      build_artifact_id: ${{ steps.build_artifact.outputs.artifact-id }}
    steps:
      - name: Resolve release request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          EVENT_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "push" || "$EVENT_REF_TYPE" != "tag" || "$EVENT_REF" != "refs/tags/$EVENT_REF_NAME" ]]; then
            echo "::error::Release request is not one exact tag push"
            exit 1
          fi
          if [[ ! "$EVENT_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release request is not one stable semantic-version tag"
            exit 1
          fi
          if ! EVENT_REF_NAME="$EVENT_REF_NAME" node -e '
            const match = /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/u.exec(process.env.EVENT_REF_NAME ?? "");
            if (match === null || match.slice(1).some(part => BigInt(part) > BigInt(Number.MAX_SAFE_INTEGER))) process.exit(1);
          '; then
            echo "::error::Release request exceeds npm's supported semantic-version range"
            exit 1
          fi
          printf 'tag=%s\n' "$EVENT_REF_NAME" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: refs/tags/${{ steps.request.outputs.tag }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.20.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Pin npm
        run: |
          set -euo pipefail
          npm install --global npm@11.19.0 \
            --ignore-scripts \
            --registry=https://registry.npmjs.org
          test "$(npm --version)" = "11.19.0"
          node -p 'JSON.stringify({ node: process.version, zlib: process.versions.zlib, platform: process.platform, arch: process.arch })'
      - name: Verify release identity
        id: identity
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REQUESTED_TAG: ${{ steps.request.outputs.tag }}
        run: |
          set -euo pipefail
          authority_output="$(node --experimental-strip-types \
            ./scripts/release-ref-authority.ts release "$REQUESTED_TAG")"
          authority=()
          while IFS= read -r line; do authority+=("$line"); done < <(
            printf '%s\n' "$authority_output"
          )
          if [[ ${#authority[@]} -ne 3 || \
                ! "${authority[0]}" =~ ^sha=([a-f0-9]{40})$ ]]; then
            echo "::error::Release ref authority output is malformed"
            exit 1
          fi
          tag_commit="${BASH_REMATCH[1]}"
          if [[ "${authority[1]}" != "tag=$REQUESTED_TAG" || \
                ! "${authority[2]}" =~ ^main_sha=([a-f0-9]{40})$ ]]; then
            echo "::error::Release ref authority did not bind tag below protected current main"
            exit 1
          fi
          verified_main_sha="${BASH_REMATCH[1]}"
          package_version="$(bun -e 'const value = await Bun.file("package.json").json(); if (typeof value.version !== "string") process.exit(1); process.stdout.write(value.version)')"
          if [[ ! "$package_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Package version $package_version is not a stable semantic version"
            exit 1
          fi
          if ! PACKAGE_VERSION="$package_version" node -e '
            const match = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/u.exec(process.env.PACKAGE_VERSION ?? "");
            if (match === null || match.slice(1).some(part => BigInt(part) > BigInt(Number.MAX_SAFE_INTEGER))) process.exit(1);
          '; then
            echo "::error::Package version $package_version exceeds npm's supported semantic-version range"
            exit 1
          fi
          expected_tag="v$package_version"
          if [[ "$REQUESTED_TAG" != "$expected_tag" ]]; then
            echo "::error::Tag $REQUESTED_TAG does not match package version $expected_tag"
            exit 1
          fi
          head_commit="$(git rev-parse --verify "HEAD^{commit}")"
          if [[ "$tag_commit" != "$head_commit" ]]; then
            echo "::error::Checked-out source $head_commit does not match tag commit $tag_commit"
            exit 1
          fi
          printf 'tag=%s\n' "$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$tag_commit" >> "$GITHUB_OUTPUT"
          printf 'main_sha=%s\n' "$verified_main_sha" >> "$GITHUB_OUTPUT"
          printf 'archive_name=hraness-ghostget-%s.tgz\n' "$package_version" >> "$GITHUB_OUTPUT"
      - name: Admit exact source CI and security
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VERIFIED_SOURCE_SHA: ${{ steps.identity.outputs.sha }}
          VERIFIED_MAIN_SHA: ${{ steps.identity.outputs.main_sha }}
        run: bun run ./scripts/release-source-ci.ts admit
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - run: |
          generated_status="$(git status --porcelain --untracked-files=all -- dist bun.lock)"
          if [[ -n "$generated_status" ]]; then
            printf '%s\n' "$generated_status"
            exit 1
          fi
      - run: bun pm pack --dry-run --ignore-scripts
      - run: node --input-type=module -e 'await Promise.all(["./dist/index.js","./dist/client.js","./dist/beeper-client.js","./dist/apple-photos-client.js","./dist/whatsapp-client.js","./dist/omni-client.js","./dist/messaging.js"].map((path) => import(path)))'
      - name: Prepare and install the exact canonical archive
        id: canonical
        env:
          VERIFIED_SHA: ${{ steps.identity.outputs.sha }}
          VERIFIED_TAG: ${{ steps.identity.outputs.tag }}
          WORKFLOW_SHA: ${{ steps.identity.outputs.main_sha }}
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/ghostget-canonical"
          mkdir -m 700 "$directory"
          npm pack --ignore-scripts --json --pack-destination "$directory" \
            --registry=https://registry.npmjs.org > "$directory/npm-pack.json"
          bun run ./scripts/github-release-artifact.ts prepare "$directory"
          bun run ./scripts/package-smoke.ts \
            --archive "$directory/hraness-ghostget-${VERIFIED_TAG#v}.tgz" \
            --pack-json "$directory/npm-pack.json"
          DIRECTORY="$directory" node <<'NODE'
          const fs = require("node:fs"); const path = require("node:path"); const crypto = require("node:crypto");
          const names = fs.readdirSync(process.env.DIRECTORY).sort();
          const hashes = Object.fromEntries(names.map(name => [name, crypto.createHash("sha256").update(fs.readFileSync(path.join(process.env.DIRECTORY, name))).digest("hex")]));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `artifact_hashes=${JSON.stringify(hashes)}\n`);
          NODE
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        id: build_artifact
        with:
          name: canonical-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ghostget-canonical
          if-no-files-found: error
          retention-days: 30

  attest:
    name: Attest exact canonical build files
    outputs:
      artifact_id: ${{ steps.attested_artifact.outputs.artifact-id }}
      bundle_sha256: ${{ steps.bundle.outputs.bundle_sha256 }}
    needs: verify
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEFAULT_BRANCH: main
      GH_TOKEN: ${{ github.token }}
      VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
      VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
    steps:
      - name: Reauthorize current release attempt
        env:
          EXPECTED_ACTOR_ID: "894119"
          EXPECTED_REPOSITORY: "hraness/ghostget"
          EXPECTED_REPOSITORY_ID: "1316443113"
          EXPECTED_WORKFLOW_ID: "323493609"
          EXPECTED_WORKFLOW_PATH: ".github/workflows/release.yml"
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ || \
                ! "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ || \
                ! "$VERIFIED_SHA" =~ ^[a-f0-9]{40}$ || \
                ! "$VERIFIED_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ || \
                "$GITHUB_EVENT_NAME" != push || \
                "$GITHUB_REPOSITORY" != "$EXPECTED_REPOSITORY" || \
                "$GITHUB_REPOSITORY_ID" != "$EXPECTED_REPOSITORY_ID" || \
                "$GITHUB_REF" != "refs/tags/$VERIFIED_TAG" || \
                "$GITHUB_SHA" != "$VERIFIED_SHA" ]]; then
            echo "::error::Current release attempt is not the exact protected tag run"
            exit 1
          fi
          if ! VERIFIED_TAG="$VERIFIED_TAG" node -e '
            const value = process.env.VERIFIED_TAG ?? "";
            const match = /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/u.exec(value);
            if (match === null || match.slice(1).some(part => BigInt(part) > BigInt(Number.MAX_SAFE_INTEGER))) process.exit(1);
          '; then
            echo "::error::Current release attempt has an unsupported stable version"
            exit 1
          fi
          attempt_json="$(mktemp "$RUNNER_TEMP/ghostget-release-attempt.XXXXXX")"
          workflow_json="$(mktemp "$RUNNER_TEMP/ghostget-release-workflow.XXXXXX")"
          repository_json="$(mktemp "$RUNNER_TEMP/ghostget-release-repository.XXXXXX")"
          tag_ref_json="$(mktemp "$RUNNER_TEMP/ghostget-release-tag-ref.XXXXXX")"
          trap 'rm -f "$attempt_json" "$workflow_json" "$repository_json" "$tag_ref_json"' EXIT
          gh api --method GET \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
            > "$attempt_json"
          gh api --method GET \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/$EXPECTED_WORKFLOW_ID" \
            > "$workflow_json"
          gh api --method GET "/repos/$GITHUB_REPOSITORY" > "$repository_json"
          ATTEMPT_JSON="$attempt_json" \
            WORKFLOW_JSON="$workflow_json" \
            REPOSITORY_JSON="$repository_json" \
            EXPECTED_ACTOR_ID="$EXPECTED_ACTOR_ID" \
            EXPECTED_REPOSITORY="$EXPECTED_REPOSITORY" \
            EXPECTED_REPOSITORY_ID="$EXPECTED_REPOSITORY_ID" \
            EXPECTED_RUN_ID="$GITHUB_RUN_ID" \
            EXPECTED_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            EXPECTED_SHA="$VERIFIED_SHA" \
            EXPECTED_TAG="$VERIFIED_TAG" \
            EXPECTED_WORKFLOW_ID="$EXPECTED_WORKFLOW_ID" \
            EXPECTED_WORKFLOW_PATH="$EXPECTED_WORKFLOW_PATH" node <<'NODE'
          const { readFileSync } = require("node:fs");
          const positiveInteger = (name) => {
            const value = process.env[name] ?? "";
            if (!/^[1-9][0-9]*$/u.test(value)) throw new Error(`Invalid ${name}`);
            const number = Number(value);
            if (!Number.isSafeInteger(number)) throw new Error(`Unsafe ${name}`);
            return number;
          };
          const attempt = JSON.parse(readFileSync(process.env.ATTEMPT_JSON, "utf8"));
          const workflow = JSON.parse(readFileSync(process.env.WORKFLOW_JSON, "utf8"));
          const repository = JSON.parse(readFileSync(process.env.REPOSITORY_JSON, "utf8"));
          const actorId = positiveInteger("EXPECTED_ACTOR_ID");
          const repositoryId = positiveInteger("EXPECTED_REPOSITORY_ID");
          const runId = positiveInteger("EXPECTED_RUN_ID");
          const runAttempt = positiveInteger("EXPECTED_RUN_ATTEMPT");
          const workflowId = positiveInteger("EXPECTED_WORKFLOW_ID");
          if (
            attempt.id !== runId
            || attempt.run_attempt !== runAttempt
            || attempt.workflow_id !== workflowId
            || attempt.path !== process.env.EXPECTED_WORKFLOW_PATH
            || attempt.event !== "push"
            || attempt.head_branch !== process.env.EXPECTED_TAG
            || attempt.head_sha !== process.env.EXPECTED_SHA
            || attempt.status !== "in_progress"
            || attempt.conclusion !== null
            || attempt.actor?.id !== actorId
            || attempt.actor?.type !== "User"
            || attempt.triggering_actor?.id !== actorId
            || attempt.triggering_actor?.type !== "User"
            || attempt.repository?.id !== repositoryId
            || attempt.repository?.full_name !== process.env.EXPECTED_REPOSITORY
            || attempt.repository?.private !== false
            || workflow.id !== workflowId
            || workflow.path !== process.env.EXPECTED_WORKFLOW_PATH
            || workflow.state !== "active"
            || repository.id !== repositoryId
            || repository.full_name !== process.env.EXPECTED_REPOSITORY
            || repository.visibility !== "public"
            || repository.private !== false
            || repository.default_branch !== "main"
          ) throw new Error("Current release attempt is not owner-authorized for this exact public workflow");
          NODE
          gh api --method GET "/repos/$GITHUB_REPOSITORY/git/ref/tags/$VERIFIED_TAG" \
            > "$tag_ref_json"
          TAG_REF_JSON="$tag_ref_json" EXPECTED_SHA="$VERIFIED_SHA" node -e '
            const value = JSON.parse(require("node:fs").readFileSync(process.env.TAG_REF_JSON, "utf8"));
            if (value?.object?.type !== "commit" || value.object.sha !== process.env.EXPECTED_SHA) process.exit(1);
          '
          current_default_sha="$(gh api --method GET --jq '.sha' \
            "/repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH")"
          if [[ ! "$current_default_sha" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Current protected main identity is malformed"
            exit 1
          fi
          comparison_status="$(gh api --method GET --jq '.status' \
            "/repos/$GITHUB_REPOSITORY/compare/$VERIFIED_SHA...$current_default_sha")"
          if [[ "$comparison_status" != ahead && "$comparison_status" != identical ]]; then
            echo "::error::Tag $VERIFIED_TAG is no longer reachable from $DEFAULT_BRANCH"
            exit 1
          fi
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: canonical-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ghostget-canonical
      - name: Bind source-free attestation input
        env:
          DIRECTORY: ${{ runner.temp }}/ghostget-canonical
          EXPECTED_WORKFLOW_SHA: ${{ needs.verify.outputs.workflow_sha }}
          EXPECTED_ARTIFACT_HASHES: ${{ needs.verify.outputs.artifact_hashes }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs'); const path = require('node:path'); const crypto = require('node:crypto');
          const directory = process.env.DIRECTORY;
          const names = [`hraness-ghostget-${process.env.VERIFIED_TAG.slice(1)}.tgz`, 'npm-pack.json', 'release-manifest.json', 'SHA256SUMS'];
          if (fs.readdirSync(directory).sort().join(',') !== [...names].sort().join(',')) throw new Error('Attestation input inventory differs');
          const hashes = JSON.parse(process.env.EXPECTED_ARTIFACT_HASHES);
          if (hashes === null || typeof hashes !== 'object' || Array.isArray(hashes) || Object.keys(hashes).sort().join(',') !== [...names].sort().join(',')) throw new Error('Trusted build hashes are malformed');
          for (const name of names) {
            const stat = fs.lstatSync(path.join(directory, name));
            if (!stat.isFile() || stat.isSymbolicLink() || stat.size <= 0 || stat.size > 8 * 1024 * 1024) throw new Error('Attestation input is not a bounded regular file');
            if (typeof hashes[name] !== 'string' || !/^[a-f0-9]{64}$/u.test(hashes[name]) || crypto.createHash('sha256').update(fs.readFileSync(path.join(directory, name))).digest('hex') !== hashes[name]) throw new Error('Attestation input differs from verified build output');
          }
          const manifest = JSON.parse(fs.readFileSync(path.join(directory, 'release-manifest.json'), 'utf8'));
          if (manifest.sourceSha !== process.env.VERIFIED_SHA || manifest.tag !== process.env.VERIFIED_TAG || manifest.workflowSha !== process.env.EXPECTED_WORKFLOW_SHA || manifest.runId !== Number(process.env.GITHUB_RUN_ID) || manifest.runAttempt !== Number(process.env.GITHUB_RUN_ATTEMPT) || manifest.repositoryId !== 1316443113 || manifest.package !== '@hraness/ghostget') throw new Error('Attestation input belongs to another build');
          const expected = names.slice(0, 3).map(name => `${crypto.createHash('sha256').update(fs.readFileSync(path.join(directory, name))).digest('hex')}  ${name}\n`).join('');
          if (fs.readFileSync(path.join(directory, 'SHA256SUMS'), 'utf8') !== expected) throw new Error('Attestation input checksums differ');
          NODE
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: provenance
        with:
          subject-path: |
            ${{ runner.temp }}/ghostget-canonical/${{ needs.verify.outputs.archive_name }}
            ${{ runner.temp }}/ghostget-canonical/npm-pack.json
            ${{ runner.temp }}/ghostget-canonical/release-manifest.json
            ${{ runner.temp }}/ghostget-canonical/SHA256SUMS
          push-to-registry: false
          create-storage-record: false
      - name: Retain verified provenance bundle
        id: bundle
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp -- "$BUNDLE_PATH" "$RUNNER_TEMP/ghostget-canonical/provenance.jsonl"
          bundle_sha256="$(sha256sum "$RUNNER_TEMP/ghostget-canonical/provenance.jsonl" | awk '{ print $1 }')"
          printf 'bundle_sha256=%s\n' "$bundle_sha256" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        id: attested_artifact
        with:
          name: canonical-attested-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ghostget-canonical
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish immutable GitHub Release
    needs: [verify, attest]
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEFAULT_BRANCH: main
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
      VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
      WORKFLOW_SHA: ${{ needs.verify.outputs.workflow_sha }}
      EXPECTED_ARTIFACT_HASHES: ${{ needs.verify.outputs.artifact_hashes }}
      EXPECTED_BUNDLE_SHA256: ${{ needs.attest.outputs.bundle_sha256 }}
    steps:
      - name: Reauthorize current release attempt
        env:
          EXPECTED_ACTOR_ID: "894119"
          EXPECTED_REPOSITORY: "hraness/ghostget"
          EXPECTED_REPOSITORY_ID: "1316443113"
          EXPECTED_WORKFLOW_ID: "323493609"
          EXPECTED_WORKFLOW_PATH: ".github/workflows/release.yml"
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ || \
                ! "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ || \
                ! "$VERIFIED_SHA" =~ ^[a-f0-9]{40}$ || \
                ! "$VERIFIED_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ || \
                "$GITHUB_EVENT_NAME" != push || \
                "$GITHUB_REPOSITORY" != "$EXPECTED_REPOSITORY" || \
                "$GITHUB_REPOSITORY_ID" != "$EXPECTED_REPOSITORY_ID" || \
                "$GITHUB_REF" != "refs/tags/$VERIFIED_TAG" || \
                "$GITHUB_SHA" != "$VERIFIED_SHA" ]]; then
            echo "::error::Current release attempt is not the exact protected tag run"
            exit 1
          fi
          if ! VERIFIED_TAG="$VERIFIED_TAG" node -e '
            const value = process.env.VERIFIED_TAG ?? "";
            const match = /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/u.exec(value);
            if (match === null || match.slice(1).some(part => BigInt(part) > BigInt(Number.MAX_SAFE_INTEGER))) process.exit(1);
          '; then
            echo "::error::Current release attempt has an unsupported stable version"
            exit 1
          fi
          attempt_json="$(mktemp "$RUNNER_TEMP/ghostget-release-attempt.XXXXXX")"
          workflow_json="$(mktemp "$RUNNER_TEMP/ghostget-release-workflow.XXXXXX")"
          repository_json="$(mktemp "$RUNNER_TEMP/ghostget-release-repository.XXXXXX")"
          tag_ref_json="$(mktemp "$RUNNER_TEMP/ghostget-release-tag-ref.XXXXXX")"
          trap 'rm -f "$attempt_json" "$workflow_json" "$repository_json" "$tag_ref_json"' EXIT
          gh api --method GET \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
            > "$attempt_json"
          gh api --method GET \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/$EXPECTED_WORKFLOW_ID" \
            > "$workflow_json"
          gh api --method GET "/repos/$GITHUB_REPOSITORY" > "$repository_json"
          ATTEMPT_JSON="$attempt_json" \
            WORKFLOW_JSON="$workflow_json" \
