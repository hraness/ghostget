name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  unconfigured:
    runs-on: ubuntu-slim
    timeout-minutes: 1
    steps:
      - run: echo 'Publication remains disabled until the checked source import binds this repository and workflow identity.' >&2; exit 1
