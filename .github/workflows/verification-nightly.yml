name: Nightly verification

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      property_runs:
        description: Property soak multiplier (GHOSTGET_PROPERTY_RUNS, 2 to 100)
        required: false
        default: "20"

permissions:
  contents: read

concurrency:
  group: verification-nightly
  cancel-in-progress: false

# Deeper checks that do not fit the PR verification budget. This workflow is
# read-only and never part of `Required`: a failure here blocks no merge or
# release, and is triaged through docs/claims-review.md.
jobs:
  quint-nightly:
    name: quint nightly bounds
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.20.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      # The same pinned-archive cache as the CI verification job; archives are
      # re-admitted at their pinned size and SHA-256 on every run.
      - name: Cache pinned checker downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ghostget-verification/downloads
          key: ghostget-verification-${{ runner.os }}-${{ runner.arch }}-pins-72eb5177a24cbf8d
      - run: bun run ./scripts/verification-tools.ts quint-nightly
        timeout-minutes: 230
      - name: Retain checker output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-quint-attempt-${{ github.run_attempt }}
          path: artifacts/verification/
          if-no-files-found: error
          retention-days: 30

  property-soak:
    name: property soak ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.20.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      # The input reaches the soak only as an environment value, which
      # src/test-support.ts parses as a bounded integer.
      - run: bun run ./scripts/verification-soak.ts ${{ matrix.shard }} 6
        env:
          GHOSTGET_PROPERTY_RUNS: ${{ inputs.property_runs || '20' }}

  mutants:
    name: reducer mutants
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.20.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run ./scripts/verification-mutants.ts
        timeout-minutes: 50
      - name: Retain mutant logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-mutants-attempt-${{ github.run_attempt }}
          path: artifacts/verification/mutants/
          if-no-files-found: error
          retention-days: 30

  provenance:
    name: messaging binary provenance
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.20.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      # Each target clones its pinned upstream commit, applies the reviewed
      # patch stack at its recorded digests (asserting the tip commit), and
      # runs the recorded pinned build. wacli must reproduce the committed
      # executable's SHA-256 byte-for-byte; imsg's record states its signed
      # bytes are non-deterministic, so its evidence is that the pinned recipe
      # builds an arm64 Mach-O, recorded honestly.
      - run: bun run ./scripts/messaging-runtime-provenance.ts nightly
        timeout-minutes: 50
