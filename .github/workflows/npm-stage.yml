name: Stage npm package

on:
  push:
    branches:
      - main
    paths:
      - package.json
  workflow_dispatch:
    inputs:
      publish_to_npm:
        description: Submit the verified stable candidate to npm staging
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: npm-stage
  cancel-in-progress: false

jobs:
  classify:
    name: Classify candidate request
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_prepare: ${{ steps.request.outputs.should_prepare }}
      source_sha: ${{ steps.request.outputs.source_sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Classify event-source package
        id: request
        env:
          BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git check-ref-format "refs/heads/$DEFAULT_BRANCH"
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::npm candidate preparation must run from $DEFAULT_BRANCH"
            exit 1
          fi
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              authority_output="$(node --experimental-strip-types \
                ./scripts/release-ref-authority.ts stage-current "$GITHUB_SHA")"
              authority=()
              while IFS= read -r line; do authority+=("$line"); done < <(
                printf '%s\n' "$authority_output"
              )
              if [[ ${#authority[@]} -ne 1 || ! "${authority[0]}" =~ ^source_sha=([a-f0-9]{40})$ ]]; then
                echo "::error::Stage-source authority output is malformed"
                exit 1
              fi
              source_sha="${BASH_REMATCH[1]}"
              previous_sha=""
              ;;
            push)
              authority_output="$(node --experimental-strip-types \
                ./scripts/release-ref-authority.ts stage-push "$GITHUB_SHA" "$BEFORE_SHA")"
              authority=()
              while IFS= read -r line; do authority+=("$line"); done < <(
                printf '%s\n' "$authority_output"
              )
              if [[ ${#authority[@]} -ne 2 || \
                    ! "${authority[0]}" =~ ^source_sha=([a-f0-9]{40})$ ]]; then
                echo "::error::Push staging authority output is malformed"
                exit 1
              fi
              source_sha="${BASH_REMATCH[1]}"
              if [[ ! "${authority[1]}" =~ ^previous_sha=([a-f0-9]{40})$ ]]; then
                echo "::error::Push staging prior-source output is malformed"
                exit 1
              fi
              previous_sha="${BASH_REMATCH[1]}"
              ;;
            *)
              echo "::error::Unsupported npm candidate event $GITHUB_EVENT_NAME"
              exit 1
              ;;
          esac
          if [[ "$GITHUB_SHA" != "$source_sha" ]]; then
            echo "::error::npm staging event source does not match admitted commit $source_sha"
            exit 1
          fi

          read_manifest_version() {
            node -e '
              const { readFileSync } = require("node:fs");
              const value = JSON.parse(readFileSync(process.argv[1], "utf8"));
              if (value === null || typeof value !== "object" || Array.isArray(value)) process.exit(1);
              const { name, version } = value;
              if (name !== "@hraness/wrench" || typeof version !== "string") process.exit(1);
              if (!/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/u.test(version)) process.exit(1);
              process.stdout.write(version);
            ' "$1"
          }

          current_manifest="$RUNNER_TEMP/wrench-current-package.json"
          git show "$source_sha:package.json" > "$current_manifest"
          if ! current_version="$(read_manifest_version "$current_manifest")"; then
            echo "::error::Current package manifest must name @hraness/wrench and use a stable semantic version"
            exit 1
          fi

          should_prepare=true
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              ;;
            push)
              previous_manifest="$RUNNER_TEMP/wrench-previous-package.json"
              git show "$previous_sha:package.json" > "$previous_manifest"
              if ! previous_version="$(read_manifest_version "$previous_manifest")"; then
                echo "::error::Previous package manifest must name @hraness/wrench and use a stable semantic version"
                exit 1
              fi
              if [[ "$current_version" == "$previous_version" ]]; then
                should_prepare=false
                echo "::notice::package.json changed without a version change; npm candidate preparation is not required"
              elif ! OLD_VERSION="$previous_version" NEW_VERSION="$current_version" node -e '
                const parse = (value) => value.split(".").map(BigInt);
                const oldVersion = parse(process.env.OLD_VERSION ?? "");
                const newVersion = parse(process.env.NEW_VERSION ?? "");
                for (let index = 0; index < 3; index += 1) {
                  if (newVersion[index] === oldVersion[index]) continue;
                  process.exit(newVersion[index] > oldVersion[index] ? 0 : 1);
                }
                process.exit(1);
              '; then
                echo "::error::Automatic npm candidate preparation requires a version newer than $previous_version, received $current_version"
                exit 1
              fi
              ;;
          esac

          printf 'should_prepare=%s\nsource_sha=%s\n' \
            "$should_prepare" "$source_sha" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify exact package
    needs: classify
    if: needs.classify.outputs.should_prepare == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact_name: ${{ steps.pack.outputs.artifact_name }}
      package_version: ${{ steps.pack.outputs.version }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
      tarball_name: ${{ steps.pack.outputs.tarball_name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ needs.classify.outputs.source_sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Verify admitted source and protected-main ancestry
        id: identity
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_SOURCE_SHA: ${{ needs.classify.outputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::npm candidate verification must run from $DEFAULT_BRANCH"
            exit 1
          fi
          authority_output="$(node --experimental-strip-types \
            ./scripts/release-ref-authority.ts stage-current "$EXPECTED_SOURCE_SHA")"
          authority=()
          while IFS= read -r line; do authority+=("$line"); done < <(
            printf '%s\n' "$authority_output"
          )
          if [[ ${#authority[@]} -ne 1 || \
                ! "${authority[0]}" =~ ^source_sha=([a-f0-9]{40})$ ]]; then
            echo "::error::Verified staging authority output is malformed"
            exit 1
          fi
          source_sha="${BASH_REMATCH[1]}"
          if [[ "$GITHUB_SHA" != "$EXPECTED_SOURCE_SHA" || \
                "$GITHUB_SHA" != "$source_sha" ]]; then
            echo "::error::npm staging checkout does not match admitted source $source_sha"
            exit 1
          fi
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
      - name: Pin npm
        run: |
          set -euo pipefail
          npm install --global npm@11.19.0 \
            --ignore-scripts \
            --registry=https://registry.npmjs.org
          node --version
          test "$(npm --version)" = "11.19.0"
      - name: Verify unpublished package identity
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          package_name="$(node -p 'require("./package.json").name')"
          package_version="$(node -p 'require("./package.json").version')"
          if [[ "$package_name" != "@hraness/wrench" ]]; then
            echo "::error::Unexpected package name $package_name"
            exit 1
          fi
          if [[ ! "$package_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Package version $package_version is not stable semantic version"
            exit 1
          fi
          node --experimental-strip-types ./scripts/release-ref-authority.ts \
            tag-absent "v$package_version" "$GITHUB_SHA" >/dev/null
          if ! npm view "$package_name" name --json \
            --registry=https://registry.npmjs.org >/dev/null; then
            echo "::error::$package_name must be bootstrapped interactively before staged publishing can run"
            exit 1
          fi
          version_error="$RUNNER_TEMP/npm-version-error.txt"
          if npm view "$package_name@$package_version" version --json \
            --registry=https://registry.npmjs.org >/dev/null 2>"$version_error"; then
            echo "::error::$package_name@$package_version is already public"
            exit 1
          fi
          if ! grep -q 'E404' "$version_error"; then
            cat "$version_error"
            echo "::error::Could not prove that $package_name@$package_version is unpublished"
            exit 1
          fi
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - name: Verify generated tree
        run: |
          set -euo pipefail
          generated_status="$(git status --porcelain --untracked-files=all -- dist bun.lock)"
          if [[ -n "$generated_status" ]]; then
            printf '%s\n' "$generated_status"
            exit 1
          fi
      - name: Pack and smoke one exact npm artifact
        id: pack
        run: |
          set -euo pipefail
          artifact_directory="$RUNNER_TEMP/wrench-npm-package"
          pack_json="$artifact_directory/npm-pack.json"
          sha256_file="$artifact_directory/npm-package.sha256"
          mkdir -p "$artifact_directory"
          npm pack \
            --ignore-scripts \
            --json \
            --pack-destination "$artifact_directory" \
            --registry=https://registry.npmjs.org > "$pack_json"
          tarball_name="$(node -e 'const fs = require("node:fs"); const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (!Array.isArray(value) || value.length !== 1 || typeof value[0].filename !== "string") process.exit(1); process.stdout.write(value[0].filename)' "$pack_json")"
          version="$(node -e 'const fs = require("node:fs"); const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (!Array.isArray(value) || value.length !== 1 || typeof value[0].version !== "string") process.exit(1); process.stdout.write(value[0].version)' "$pack_json")"
          tarball="$artifact_directory/$tarball_name"
          bun run ./scripts/package-smoke.ts \
            --archive "$tarball" \
            --pack-json "$pack_json"
          sha256sum "$tarball" | awk '{ print $1 }' > "$sha256_file"
          artifact_name="npm-package-$version-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf 'artifact_name=%s\ntarball_name=%s\nversion=%s\n' \
            "$artifact_name" "$tarball_name" "$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.pack.outputs.artifact_name }}
          path: ${{ runner.temp }}/wrench-npm-package
          if-no-files-found: error
          retention-days: 30

  stage:
    name: Stage exact package
    needs: verify
    if: needs.verify.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.publish_to_npm == true
    permissions:
      actions: read
      contents: read
      id-token: write
    environment: npm-stage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reauthorize current npm stage attempt
        env:
          EXPECTED_ACTOR_ID: "894119"
          EXPECTED_REPOSITORY: "hraness/wrench"
          EXPECTED_REPOSITORY_ID: "1316443113"
          EXPECTED_WORKFLOW_ID: "344213783"
          EXPECTED_WORKFLOW_NAME: "Stage npm package"
          EXPECTED_WORKFLOW_PATH: ".github/workflows/npm-stage.yml"
          GH_TOKEN: ${{ github.token }}
          INPUT_PUBLISH_TO_NPM: ${{ inputs.publish_to_npm }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ || \
                ! "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ || \
                ! "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ || \
                "$GITHUB_EVENT_NAME" != workflow_dispatch || \
                "$GITHUB_REF" != refs/heads/main || \
                "$GITHUB_REPOSITORY" != "$EXPECTED_REPOSITORY" || \
                "$GITHUB_REPOSITORY_ID" != "$EXPECTED_REPOSITORY_ID" || \
                "$INPUT_PUBLISH_TO_NPM" != true || \
                "$REF_PROTECTED" != true ]]; then
            echo "::error::npm staging requires an intentional owner dispatch from protected main"
            exit 1
          fi
          attempt_json="$(mktemp "$RUNNER_TEMP/wrench-stage-attempt.XXXXXX")"
          workflow_json="$(mktemp "$RUNNER_TEMP/wrench-stage-workflow.XXXXXX")"
          repository_json="$(mktemp "$RUNNER_TEMP/wrench-stage-repository.XXXXXX")"
          trap 'rm -f "$attempt_json" "$workflow_json" "$repository_json"' EXIT
          gh api --method GET \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
            > "$attempt_json"
          gh api --method GET \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/$EXPECTED_WORKFLOW_ID" \
            > "$workflow_json"
          gh api --method GET "/repos/$GITHUB_REPOSITORY" > "$repository_json"
          ATTEMPT_JSON="$attempt_json" \
            WORKFLOW_JSON="$workflow_json" \
            REPOSITORY_JSON="$repository_json" \
            EXPECTED_ACTOR_ID="$EXPECTED_ACTOR_ID" \
            EXPECTED_REPOSITORY="$EXPECTED_REPOSITORY" \
            EXPECTED_REPOSITORY_ID="$EXPECTED_REPOSITORY_ID" \
            EXPECTED_RUN_ID="$GITHUB_RUN_ID" \
            EXPECTED_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            EXPECTED_SHA="$GITHUB_SHA" \
            EXPECTED_WORKFLOW_ID="$EXPECTED_WORKFLOW_ID" \
            EXPECTED_WORKFLOW_NAME="$EXPECTED_WORKFLOW_NAME" \
            EXPECTED_WORKFLOW_PATH="$EXPECTED_WORKFLOW_PATH" node <<'NODE'
          const { readFileSync } = require("node:fs");
          const positiveInteger = (name) => {
            const value = process.env[name] ?? "";
            if (!/^[1-9][0-9]*$/u.test(value)) throw new Error(`Invalid ${name}`);
            const number = Number(value);
            if (!Number.isSafeInteger(number)) throw new Error(`Unsafe ${name}`);
            return number;
          };
          const attempt = JSON.parse(readFileSync(process.env.ATTEMPT_JSON, "utf8"));
          const workflow = JSON.parse(readFileSync(process.env.WORKFLOW_JSON, "utf8"));
          const repository = JSON.parse(readFileSync(process.env.REPOSITORY_JSON, "utf8"));
          const actorId = positiveInteger("EXPECTED_ACTOR_ID");
          const repositoryId = positiveInteger("EXPECTED_REPOSITORY_ID");
          const runId = positiveInteger("EXPECTED_RUN_ID");
          const runAttempt = positiveInteger("EXPECTED_RUN_ATTEMPT");
          const workflowId = positiveInteger("EXPECTED_WORKFLOW_ID");
          if (
            attempt.id !== runId
            || attempt.run_attempt !== runAttempt
            || attempt.workflow_id !== workflowId
            || attempt.name !== process.env.EXPECTED_WORKFLOW_NAME
            || attempt.path !== process.env.EXPECTED_WORKFLOW_PATH
            || attempt.event !== "workflow_dispatch"
            || attempt.head_branch !== "main"
            || attempt.head_sha !== process.env.EXPECTED_SHA
            || attempt.status !== "in_progress"
            || attempt.conclusion !== null
            || attempt.actor?.id !== actorId
            || attempt.actor?.type !== "User"
            || attempt.triggering_actor?.id !== actorId
            || attempt.triggering_actor?.type !== "User"
            || attempt.repository?.id !== repositoryId
            || attempt.repository?.full_name !== process.env.EXPECTED_REPOSITORY
            || attempt.repository?.private !== false
            || workflow.id !== workflowId
            || workflow.name !== process.env.EXPECTED_WORKFLOW_NAME
            || workflow.path !== process.env.EXPECTED_WORKFLOW_PATH
            || workflow.state !== "active"
            || repository.id !== repositoryId
            || repository.full_name !== process.env.EXPECTED_REPOSITORY
            || repository.visibility !== "public"
            || repository.private !== false
            || repository.default_branch !== "main"
          ) throw new Error("Current npm stage attempt is not owner-authorized for this exact public workflow");
          NODE
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Pin npm
        run: |
          set -euo pipefail
          npm install --global npm@11.19.0 \
            --ignore-scripts \
            --registry=https://registry.npmjs.org
          test "$(npm --version)" = "11.19.0"
      - name: Bind verified artifact identity
        id: package_identity
        env:
          EXPECTED_ARTIFACT_NAME: ${{ needs.verify.outputs.artifact_name }}
          EXPECTED_SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          EXPECTED_TARBALL_NAME: ${{ needs.verify.outputs.tarball_name }}
          EXPECTED_VERSION: ${{ needs.verify.outputs.package_version }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Verified package version is not stable semantic version"
            exit 1
          fi
          if [[ ! "$EXPECTED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ || "$EXPECTED_SOURCE_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::Verified source SHA does not match this workflow revision"
            exit 1
          fi
          if [[ ! "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ || ! "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::GitHub run identity is invalid"
            exit 1
          fi
          tarball_name="hraness-wrench-$EXPECTED_VERSION.tgz"
          if [[ "$EXPECTED_TARBALL_NAME" != "$tarball_name" ]]; then
            echo "::error::Verified tarball name does not match the package version"
            exit 1
          fi
          artifact_name="npm-package-$EXPECTED_VERSION-$EXPECTED_SOURCE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [[ "$EXPECTED_ARTIFACT_NAME" != "$artifact_name" ]]; then
            echo "::error::Verified artifact name does not match this workflow run"
            exit 1
          fi
          printf 'artifact_name=%s\ntarball_name=%s\nversion=%s\nsource_sha=%s\n' \
            "$artifact_name" "$tarball_name" "$EXPECTED_VERSION" "$EXPECTED_SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ steps.package_identity.outputs.artifact_name }}
          path: ${{ runner.temp }}/wrench-npm-package
      - name: Bind downloaded artifact
        id: artifact
        env:
          EXPECTED_TARBALL_NAME: ${{ steps.package_identity.outputs.tarball_name }}
          EXPECTED_VERSION: ${{ steps.package_identity.outputs.version }}
        run: |
          set -euo pipefail
          artifact_directory="$RUNNER_TEMP/wrench-npm-package"
          pack_json="$artifact_directory/npm-pack.json"
          sha256_file="$artifact_directory/npm-package.sha256"
          tarball="$artifact_directory/$EXPECTED_TARBALL_NAME"
          mapfile -d '' artifact_entries < <(find "$artifact_directory" -mindepth 1 -maxdepth 1 -print0 | sort -z)
          if [[ ${#artifact_entries[@]} -ne 3 ]]; then
            echo "::error::Downloaded npm artifact must contain exactly the tarball, npm-pack.json, and npm-package.sha256"
            exit 1
          fi
          for required_file in "$pack_json" "$sha256_file" "$tarball"; do
            if [[ ! -f "$required_file" || -L "$required_file" ]]; then
              echo "::error::Downloaded npm artifact contains an unsafe or unexpected entry"
              exit 1
            fi
          done
          PACK_JSON="$pack_json" TARBALL="$tarball" \
            EXPECTED_TARBALL_NAME="$EXPECTED_TARBALL_NAME" \
            EXPECTED_VERSION="$EXPECTED_VERSION" node <<'NODE'
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const zlib = require("node:zlib");
          const value = JSON.parse(fs.readFileSync(process.env.PACK_JSON, "utf8"));
          if (!Array.isArray(value) || value.length !== 1) throw new Error("npm-pack.json must contain exactly one package");
          const record = value[0];
          if (record?.name !== "@hraness/wrench") throw new Error("npm-pack.json has the wrong package name");
          if (record?.version !== process.env.EXPECTED_VERSION) throw new Error("npm-pack.json has the wrong package version");
          if (record?.filename !== process.env.EXPECTED_TARBALL_NAME) throw new Error("npm-pack.json has the wrong tarball name");
          if (!/^hraness-wrench-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.tgz$/u.test(record.filename)) throw new Error("npm-pack.json has an unsafe tarball name");
          for (const field of ["entryCount", "size", "unpackedSize"]) {
            if (!Number.isSafeInteger(record[field]) || record[field] < 0) throw new Error(`npm-pack.json has invalid ${field}`);
          }
          if (!Array.isArray(record.files) || record.files.length !== record.entryCount) throw new Error("npm-pack.json has an invalid file inventory");
          const bytes = fs.readFileSync(process.env.TARBALL);
          if (bytes.byteLength !== record.size) throw new Error("Downloaded tarball size differs from npm-pack.json");
          const integrity = `sha512-${crypto.createHash("sha512").update(bytes).digest("base64")}`;
          const shasum = crypto.createHash("sha1").update(bytes).digest("hex");
          if (record.integrity !== integrity || record.shasum !== shasum) throw new Error("Downloaded tarball digest differs from npm-pack.json");
          const tar = zlib.gunzipSync(bytes, {
            maxOutputLength: 32 * 1024 * 1024 + 512 * 1_280,
          });
          const tarText = (header, start, length) => {
            const field = header.subarray(start, start + length);
            const zero = field.indexOf(0);
            const selected = zero < 0 ? field : field.subarray(0, zero);
            if (selected.some(byte => byte > 0x7f)) throw new Error("Packed package.json tar header is not ASCII");
            return selected.toString("ascii");
          };
          const tarOctal = (header, start, length, label) => {
            const text = tarText(header, start, length).trim();
            if (!/^[0-7]+$/u.test(text)) throw new Error(`Packed package.json has an invalid ${label}`);
            const value = Number.parseInt(text, 8);
            if (!Number.isSafeInteger(value) || value < 0) throw new Error(`Packed package.json has an unsafe ${label}`);
            return value;
          };
          let offset = 0;
          let zeroBlocks = 0;
          let entries = 0;
          let manifestBytes;
          while (offset < tar.length) {
            if (tar.length - offset < 512) throw new Error("Packed package.json tar header is truncated");
            const header = tar.subarray(offset, offset + 512);
            offset += 512;
            if (header.every(byte => byte === 0)) {
              zeroBlocks += 1;
              if (zeroBlocks === 2) {
                if (tar.subarray(offset).some(byte => byte !== 0)) throw new Error("Packed package.json tar has trailing data");
                break;
              }
              continue;
            }
            if (zeroBlocks !== 0) throw new Error("Packed package.json tar terminator is invalid");
            const expectedChecksum = tarOctal(header, 148, 8, "checksum");
            let checksum = 0;
            for (let index = 0; index < header.length; index += 1) {
              checksum += index >= 148 && index < 156 ? 0x20 : header[index];
            }
            if (checksum !== expectedChecksum || tarText(header, 257, 6) !== "ustar") {
              throw new Error("Packed package.json tar header is invalid");
            }
            const name = tarText(header, 0, 100);
            const prefix = tarText(header, 345, 155);
            const path = prefix === "" ? name : `${prefix}/${name}`;
            if (path.startsWith("/") || path.includes("\\") || path.split("/").some(part => part === "" || part === "." || part === "..")) {
              throw new Error("Packed package.json tar path is unsafe");
            }
            const size = tarOctal(header, 124, 12, "size");
            const type = header[156];
            if (type !== 0 && type !== 0x30 && type !== 0x35) throw new Error("Packed package.json tar contains a non-regular entry");
            if (type === 0x35 && size !== 0) throw new Error("Packed package.json tar directory has data");
            if (size > tar.length - offset) throw new Error("Packed package.json tar entry is truncated");
            const padded = Math.ceil(size / 512) * 512;
            if (padded > tar.length - offset || tar.subarray(offset + size, offset + padded).some(byte => byte !== 0)) {
              throw new Error("Packed package.json tar padding is invalid");
            }
            if (path === "package/package.json") {
              if ((type !== 0 && type !== 0x30) || manifestBytes !== undefined || size < 1 || size > 256 * 1024) {
                throw new Error("Packed package.json is missing, duplicated, or unsafe");
              }
              manifestBytes = Buffer.from(tar.subarray(offset, offset + size));
            }
            offset += padded;
            entries += 1;
            if (entries > 1_280) throw new Error("Packed package.json tar contains too many entries");
          }
          if (zeroBlocks !== 2 || manifestBytes === undefined) throw new Error("Packed package.json is missing");
          const manifest = JSON.parse(new TextDecoder("utf-8", { fatal: true }).decode(manifestBytes));
          const publishConfig = manifest?.publishConfig;
          if (
            manifest?.name !== "@hraness/wrench"
            || manifest?.version !== process.env.EXPECTED_VERSION
            || manifest?.private !== false
            || manifest?.contentPolicy?.class !== "dual-use"
            || publishConfig === null
            || typeof publishConfig !== "object"
            || Array.isArray(publishConfig)
            || JSON.stringify(Object.keys(publishConfig).sort()) !== JSON.stringify(["access", "registry"])
            || publishConfig.access !== "public"
            || publishConfig.registry !== "https://registry.npmjs.org"
          ) throw new Error("Packed Wrench can publish only to the canonical public npm registry");
          NODE
          expected_sha256="$(tr -d '\n' < "$sha256_file")"
          if [[ ! "$expected_sha256" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::Downloaded npm-package.sha256 is invalid"
            exit 1
          fi
          actual_sha256="$(sha256sum "$tarball" | awk '{ print $1 }')"
          if [[ "$actual_sha256" != "$expected_sha256" ]]; then
            echo "::error::Downloaded tarball does not match the verified SHA-256"
            exit 1
          fi
          printf 'sha256=%s\ntarball=%s\n' "$actual_sha256" "$tarball" >> "$GITHUB_OUTPUT"
      - name: Revalidate protected-main ancestry and stage exact package
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_SOURCE_SHA: ${{ steps.package_identity.outputs.source_sha }}
          EXPECTED_TARBALL_SHA256: ${{ steps.artifact.outputs.sha256 }}
          EXPECTED_VERSION: ${{ steps.package_identity.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ steps.artifact.outputs.tarball }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "hraness/wrench" || "$DEFAULT_BRANCH" != "main" ]]; then
            echo "::error::Terminal staging must run in the Wrench protected-main context"
            exit 1
          fi
          repository_url="https://github.com/hraness/wrench.git"
          if [[ "$GITHUB_SHA" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "::error::Verified workflow source moved before staging"
            exit 1
          fi
          current_tarball_sha256="$(sha256sum "$TARBALL" | awk '{ print $1 }')"
          if [[ "$current_tarball_sha256" != "$EXPECTED_TARBALL_SHA256" ]]; then
            echo "::error::Downloaded tarball changed after current-$DEFAULT_BRANCH verification"
            exit 1
          fi
          git ls-remote --sort=refname --refs "$repository_url" \
            "refs/heads/main" "refs/tags/v$EXPECTED_VERSION" \
            > "$RUNNER_TEMP/governed-1.refs"
          advertised_main="$(EXPECTED_TAG="v$EXPECTED_VERSION" \
            SNAPSHOT="$RUNNER_TEMP/governed-1.refs" \
            node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const sha = /^[0-9a-f]{40}$/u;
          const stableTag = /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/u;
          const expectedTag = process.env.EXPECTED_TAG ?? "";
          if (!stableTag.test(expectedTag)) {
            throw new Error("Terminal staging coordinates are malformed");
          }
          const path = process.env.SNAPSHOT;
          if (typeof path !== "string" || path.length === 0) {
            throw new Error("Terminal staging ref snapshot is missing");
          }
          const value = readFileSync(path);
          const rows = value.reduce(
            (count, byte) => count + (byte === 0x0a ? 1 : 0),
            0,
          );
          if (value.byteLength > 64 * 1024 || rows > 500) {
            throw new Error("Terminal staging ref snapshot exceeds its fixed bounds");
          }
          const snapshot = new TextDecoder("utf-8", { fatal: true }).decode(value);
          if (snapshot.includes("\0") || snapshot.includes("\r")) {
            throw new Error("Terminal staging ref snapshot is not canonical");
          }
          const expectedTagRowSuffix = `\trefs/tags/${expectedTag}`;
          if (snapshot.split("\n").some((row) => row.endsWith(expectedTagRowSuffix))) {
            throw new Error(`Tag ${expectedTag} exists at the terminal staging boundary`);
          }
          const match = /^([0-9a-f]{40})\trefs\/heads\/main\n$/u.exec(snapshot);
          if (match?.[1] === undefined || !sha.test(match[1])) {
            throw new Error("main or exact-tag authority is malformed at the terminal staging boundary");
          }
          process.stdout.write(match[1]);
          NODE
          )"
          if [[ "$advertised_main" != "$EXPECTED_SOURCE_SHA" ]]; then
            comparison="$(gh api \
              "/repos/$GITHUB_REPOSITORY/compare/$EXPECTED_SOURCE_SHA...$advertised_main" \
              --jq '[.status, .ahead_by, .behind_by, .base_commit.sha, .merge_base_commit.sha, .commits[-1].sha] | @tsv')"
            EXPECTED_ANCESTOR="$EXPECTED_SOURCE_SHA" \
              EXPECTED_DESCENDANT="$advertised_main" COMPARISON="$comparison" \
              node --input-type=module <<'NODE'
            const sha = /^[0-9a-f]{40}$/u;
            const ancestor = process.env.EXPECTED_ANCESTOR ?? "";
            const descendant = process.env.EXPECTED_DESCENDANT ?? "";
            const fields = (process.env.COMPARISON ?? "").split("\t");
            if (!sha.test(ancestor) || !sha.test(descendant) || fields.length !== 6) {
              throw new Error("Terminal staging ancestry response is malformed");
            }
            const [status, ahead, behind, base, mergeBase, terminal] = fields;
            if (
              status !== "ahead" ||
              !/^[1-9][0-9]*$/u.test(ahead ?? "") ||
              !Number.isSafeInteger(Number(ahead)) ||
              behind !== "0" ||
              base !== ancestor ||
              mergeBase !== ancestor ||
              terminal !== descendant
            ) {
              throw new Error("Terminal staging source is not an ancestor of protected main");
            }
          NODE
          fi
          git ls-remote --sort=refname --refs "$repository_url" \
            "refs/heads/main" "refs/tags/v$EXPECTED_VERSION" \
            > "$RUNNER_TEMP/governed-2.refs"
          if ! cmp --silent \
            "$RUNNER_TEMP/governed-1.refs" "$RUNNER_TEMP/governed-2.refs"; then
            echo "::error::Governed refs changed between terminal staging advertisements"
            exit 1
          fi
          npm stage publish "$TARBALL" \
            --access public \
            --ignore-scripts \
            --provenance \
            --tag latest \
            --registry=https://registry.npmjs.org
