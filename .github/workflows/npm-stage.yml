name: Stage npm package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact canonical GitHub Release to mirror (defaults to current package version)
        required: false
        default: ""
        type: string
      publish_to_npm:
        description: Submit the verified stable candidate to npm staging
        required: false
        default: false
        type: boolean
      resolved_stage_version:
        description: Exact prior staged version already rejected by npm (exceptional recovery only)
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: npm-stage
  cancel-in-progress: false

jobs:
  classify:
    name: Classify candidate request
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_prepare: ${{ steps.request.outputs.should_prepare }}
      source_sha: ${{ steps.request.outputs.source_sha }}
      release_sha: ${{ steps.request.outputs.release_sha }}
      release_tag: ${{ steps.request.outputs.release_tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Classify event-source package
        id: request
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INPUT_PUBLISH_TO_NPM: ${{ inputs.publish_to_npm }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          RESOLVED_STAGE_VERSION: ${{ inputs.resolved_stage_version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$GITHUB_REF" != refs/heads/main || "$DEFAULT_BRANCH" != main ]]; then
            echo "::error::Optional npm mirror preparation requires a protected-main dispatch"
            exit 1
          fi
          if [[ -n "$RESOLVED_STAGE_VERSION" && "$INPUT_PUBLISH_TO_NPM" != true ]]; then
            echo "::error::resolved_stage_version is valid only for an intentional npm staging dispatch"
            exit 1
          fi
          authority_output="$(node --experimental-strip-types ./scripts/release-ref-authority.ts stage-current "$GITHUB_SHA")"
          if [[ "$authority_output" != "source_sha=$GITHUB_SHA" ]]; then
            echo "::error::Mirror workflow source is not exact protected main"
            exit 1
          fi
          requested_tag="$INPUT_RELEASE_TAG"
          if [[ -z "$requested_tag" ]]; then
            requested_tag="v$(node -p 'require("./package.json").version')"
          fi
          release_authority="$(node --experimental-strip-types ./scripts/release-ref-authority.ts promotion "$requested_tag" "$GITHUB_SHA" "")"
          authority=()
          while IFS= read -r line; do authority+=("$line"); done < <(printf '%s\n' "$release_authority")
          if [[ ${#authority[@]} -ne 3 || ! "${authority[0]}" =~ ^sha=([a-f0-9]{40})$ ]]; then
            echo "::error::Canonical mirror source authority is malformed"
            exit 1
          fi
          release_sha="${BASH_REMATCH[1]}"
          if [[ "${authority[1]}" != "tag=$requested_tag" || ! "${authority[2]}" =~ ^main_sha=([a-f0-9]{40})$ ]]; then
            echo "::error::Mirror source does not precede the protected-main workflow"
            exit 1
          fi
          printf 'should_prepare=true\nsource_sha=%s\nrelease_sha=%s\nrelease_tag=%s\n' \
            "$GITHUB_SHA" "$release_sha" "$requested_tag" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify exact package
    needs: classify
    if: needs.classify.outputs.should_prepare == 'true'
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact_name: ${{ steps.pack.outputs.artifact_name }}
      package_version: ${{ steps.pack.outputs.version }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
      tarball_name: ${{ steps.pack.outputs.tarball_name }}
      release_sha: ${{ needs.classify.outputs.release_sha }}
      release_id: ${{ steps.pack.outputs.release_id }}
      release_run_id: ${{ steps.pack.outputs.release_run_id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Verify admitted source and protected-main ancestry
        id: identity
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_SOURCE_SHA: ${{ needs.classify.outputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::npm candidate verification must run from $DEFAULT_BRANCH"
            exit 1
          fi
          authority_output="$(node --experimental-strip-types \
            ./scripts/release-ref-authority.ts stage-current "$EXPECTED_SOURCE_SHA")"
          authority=()
          while IFS= read -r line; do authority+=("$line"); done < <(
            printf '%s\n' "$authority_output"
          )
          if [[ ${#authority[@]} -ne 1 || \
                ! "${authority[0]}" =~ ^source_sha=([a-f0-9]{40})$ ]]; then
            echo "::error::Verified staging authority output is malformed"
            exit 1
          fi
          source_sha="${BASH_REMATCH[1]}"
          if [[ "$GITHUB_SHA" != "$EXPECTED_SOURCE_SHA" || \
                "$GITHUB_SHA" != "$source_sha" ]]; then
            echo "::error::npm staging checkout does not match admitted source $source_sha"
            exit 1
          fi
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
      - name: Pin npm
        run: |
          set -euo pipefail
          npm install --global npm@11.19.0 \
            --ignore-scripts \
            --registry=https://registry.npmjs.org
          node --version
          test "$(npm --version)" = "11.19.0"
      - name: Verify unpublished package identity
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CANONICAL_TAG: ${{ needs.classify.outputs.release_tag }}
        run: |
          set -euo pipefail
          package_name="@hraness/wrench"
          package_version="${CANONICAL_TAG#v}"
          if [[ "$package_name" != "@hraness/wrench" ]]; then
            echo "::error::Unexpected package name $package_name"
            exit 1
          fi
          if ! PACKAGE_VERSION="$package_version" node -e '
            const value = process.env.PACKAGE_VERSION ?? "";
            const match = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/u.exec(value);
            if (match === null || match.slice(1).some(part => BigInt(part) > BigInt(Number.MAX_SAFE_INTEGER))) process.exit(1);
          '; then
            echo "::error::Package version $package_version is not stable semantic version"
            exit 1
          fi
          if ! npm view "$package_name" name --json \
            --registry=https://registry.npmjs.org >/dev/null; then
            echo "::error::$package_name must be bootstrapped interactively before staged publishing can run"
            exit 1
          fi
          version_error="$RUNNER_TEMP/npm-version-error.txt"
          if npm view "$package_name@$package_version" version --json \
            --registry=https://registry.npmjs.org >/dev/null 2>"$version_error"; then
            echo "::error::$package_name@$package_version is already public"
            exit 1
          fi
          if ! grep -q 'E404' "$version_error"; then
            cat "$version_error"
            echo "::error::Could not prove that $package_name@$package_version is unpublished"
            exit 1
          fi
      - name: Pack and smoke one exact npm artifact
        id: pack
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ needs.classify.outputs.release_sha }}
          VERIFIED_TAG: ${{ needs.classify.outputs.release_tag }}
        run: |
          set -euo pipefail
          canonical_directory="$RUNNER_TEMP/wrench-mirror-canonical"
          node --experimental-strip-types ./scripts/release-ref-authority.ts promotion \
            "$VERIFIED_TAG" "$GITHUB_SHA" "$VERIFIED_SHA" >/dev/null
          bun run ./scripts/github-release-artifact.ts download "$canonical_directory"
          artifact_directory="$RUNNER_TEMP/wrench-npm-package"
          mkdir -m 700 "$artifact_directory"
          version="${VERIFIED_TAG#v}"
          tarball_name="hraness-wrench-$version.tgz"
          cp -- "$canonical_directory/$tarball_name" "$artifact_directory/$tarball_name"
          cp -- "$canonical_directory/npm-pack.json" "$artifact_directory/npm-pack.json"
          sha256sum "$artifact_directory/$tarball_name" | awk '{ print $1 }' > "$artifact_directory/npm-package.sha256"
          # The tagged source owns this version's package contract; it executes only in this read-only job.
          smoke_source="$RUNNER_TEMP/wrench-mirror-source"
          git worktree add --detach "$smoke_source" "$VERIFIED_SHA"
          (cd "$smoke_source" && bun install --frozen-lockfile --ignore-scripts && bun run check)
          generated_status="$(git -C "$smoke_source" status --porcelain --untracked-files=all -- dist bun.lock)"
          if [[ -n "$generated_status" ]]; then
            printf '%s\n' "$generated_status"
            exit 1
          fi
          (cd "$smoke_source" && bun run ./scripts/package-smoke.ts \
            --archive "$artifact_directory/$tarball_name" --pack-json "$artifact_directory/npm-pack.json")
          artifact_name="npm-package-$version-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERIFIED_TAG" --jq '.id')"
          release_run_id="$(node -p 'require(process.argv[1]).runId' "$canonical_directory/release-manifest.json")"
          if [[ ! "$release_id" =~ ^[1-9][0-9]*$ || ! "$release_run_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Canonical release identity is malformed"
            exit 1
          fi
          printf 'artifact_name=%s\ntarball_name=%s\nversion=%s\nrelease_id=%s\nrelease_run_id=%s\n' \
            "$artifact_name" "$tarball_name" "$version" "$release_id" "$release_run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.pack.outputs.artifact_name }}
          path: ${{ runner.temp }}/wrench-npm-package
          if-no-files-found: error
          retention-days: 30

  stage:
    name: Stage exact package v${{ needs.verify.outputs.package_version }}
    needs: verify
    if: needs.verify.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.publish_to_npm == true
    permissions:
      actions: read
      contents: read
      id-token: write
    environment: npm-stage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reauthorize current npm stage attempt
        env:
          EXPECTED_ACTOR_ID: "894119"
          EXPECTED_REPOSITORY: "hraness/wrench"
          EXPECTED_REPOSITORY_ID: "1316443113"
          EXPECTED_WORKFLOW_ID: "344213783"
          EXPECTED_WORKFLOW_PATH: ".github/workflows/npm-stage.yml"
          GH_TOKEN: ${{ github.token }}
          INPUT_PUBLISH_TO_NPM: ${{ inputs.publish_to_npm }}
          REF_PROTECTED: ${{ github.ref_protected }}
          RESOLVED_STAGE_VERSION: ${{ inputs.resolved_stage_version }}
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ || \
                ! "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ || \
                ! "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ || \
                "$GITHUB_EVENT_NAME" != workflow_dispatch || \
                "$GITHUB_REF" != refs/heads/main || \
                "$GITHUB_REPOSITORY" != "$EXPECTED_REPOSITORY" || \
                "$GITHUB_REPOSITORY_ID" != "$EXPECTED_REPOSITORY_ID" || \
                "$INPUT_PUBLISH_TO_NPM" != true || \
                "$REF_PROTECTED" != true ]]; then
            echo "::error::npm staging requires an intentional owner dispatch from protected main"
            exit 1
          fi
          if [[ -n "$RESOLVED_STAGE_VERSION" ]] && ! RESOLVED_STAGE_VERSION="$RESOLVED_STAGE_VERSION" node -e '
            const value = process.env.RESOLVED_STAGE_VERSION ?? "";
            const match = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/u.exec(value);
            if (match === null || match.slice(1).some(part => BigInt(part) > BigInt(Number.MAX_SAFE_INTEGER))) process.exit(1);
          '; then
            echo "::error::resolved_stage_version must be one stable semantic version within npm's safe numeric range"
            exit 1
          fi
          attempt_json="$(mktemp "$RUNNER_TEMP/wrench-stage-attempt.XXXXXX")"
          workflow_json="$(mktemp "$RUNNER_TEMP/wrench-stage-workflow.XXXXXX")"
          repository_json="$(mktemp "$RUNNER_TEMP/wrench-stage-repository.XXXXXX")"
          trap 'rm -f "$attempt_json" "$workflow_json" "$repository_json"' EXIT
          gh api --method GET \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
            > "$attempt_json"
          gh api --method GET \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/$EXPECTED_WORKFLOW_ID" \
            > "$workflow_json"
          gh api --method GET "/repos/$GITHUB_REPOSITORY" > "$repository_json"
          ATTEMPT_JSON="$attempt_json" \
            WORKFLOW_JSON="$workflow_json" \
            REPOSITORY_JSON="$repository_json" \
            EXPECTED_ACTOR_ID="$EXPECTED_ACTOR_ID" \
            EXPECTED_REPOSITORY="$EXPECTED_REPOSITORY" \
            EXPECTED_REPOSITORY_ID="$EXPECTED_REPOSITORY_ID" \
            EXPECTED_RUN_ID="$GITHUB_RUN_ID" \
            EXPECTED_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            EXPECTED_SHA="$GITHUB_SHA" \
            EXPECTED_WORKFLOW_ID="$EXPECTED_WORKFLOW_ID" \
            EXPECTED_WORKFLOW_PATH="$EXPECTED_WORKFLOW_PATH" node <<'NODE'
          const { readFileSync } = require("node:fs");
          const positiveInteger = (name) => {
            const value = process.env[name] ?? "";
            if (!/^[1-9][0-9]*$/u.test(value)) throw new Error(`Invalid ${name}`);
            const number = Number(value);
            if (!Number.isSafeInteger(number)) throw new Error(`Unsafe ${name}`);
            return number;
          };
          const attempt = JSON.parse(readFileSync(process.env.ATTEMPT_JSON, "utf8"));
          const workflow = JSON.parse(readFileSync(process.env.WORKFLOW_JSON, "utf8"));
          const repository = JSON.parse(readFileSync(process.env.REPOSITORY_JSON, "utf8"));
          const actorId = positiveInteger("EXPECTED_ACTOR_ID");
          const repositoryId = positiveInteger("EXPECTED_REPOSITORY_ID");
          const runId = positiveInteger("EXPECTED_RUN_ID");
          const runAttempt = positiveInteger("EXPECTED_RUN_ATTEMPT");
          const workflowId = positiveInteger("EXPECTED_WORKFLOW_ID");
          if (
            attempt.id !== runId
            || attempt.run_attempt !== runAttempt
            || attempt.workflow_id !== workflowId
            || attempt.path !== process.env.EXPECTED_WORKFLOW_PATH
            || attempt.event !== "workflow_dispatch"
            || attempt.head_branch !== "main"
            || attempt.head_sha !== process.env.EXPECTED_SHA
            || attempt.status !== "in_progress"
            || attempt.conclusion !== null
            || attempt.actor?.id !== actorId
            || attempt.actor?.type !== "User"
            || attempt.triggering_actor?.id !== actorId
            || attempt.triggering_actor?.type !== "User"
            || attempt.repository?.id !== repositoryId
            || attempt.repository?.full_name !== process.env.EXPECTED_REPOSITORY
            || attempt.repository?.private !== false
            || workflow.id !== workflowId
            || workflow.path !== process.env.EXPECTED_WORKFLOW_PATH
            || workflow.state !== "active"
            || repository.id !== repositoryId
            || repository.full_name !== process.env.EXPECTED_REPOSITORY
            || repository.visibility !== "public"
            || repository.private !== false
            || repository.default_branch !== "main"
          ) throw new Error("Current npm stage attempt is not owner-authorized for this exact public workflow");
          NODE
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Pin npm
        run: |
          set -euo pipefail
          npm install --global npm@11.19.0 \
            --ignore-scripts \
            --registry=https://registry.npmjs.org
          test "$(npm --version)" = "11.19.0"
      - name: Establish clean npm publication defaults
        id: npm_config
        run: |
          set -euo pipefail
          clean_directory="$RUNNER_TEMP/wrench-clean-npm"
          user_config="$RUNNER_TEMP/wrench-npm-userconfig"
          global_config="$RUNNER_TEMP/wrench-npm-globalconfig"
          mkdir -p "$clean_directory"
          : > "$user_config"
          : > "$global_config"
          chmod 600 "$user_config" "$global_config"
          unset NPM_CONFIG_TAG npm_config_tag
          configured_tag="$(cd "$clean_directory" && \
            NPM_CONFIG_USERCONFIG="$user_config" \
            NPM_CONFIG_GLOBALCONFIG="$global_config" \
            npm config get tag)"
          if [[ "$configured_tag" != latest ]]; then
            echo "::error::Pinned npm does not have the clean default publication tag latest"
            exit 1
          fi
          printf 'directory=%s\nuserconfig=%s\nglobalconfig=%s\n' \
            "$clean_directory" "$user_config" "$global_config" >> "$GITHUB_OUTPUT"
      - name: Reject unresolved stable-stage intent
        env:
          EXPECTED_REPOSITORY: "hraness/wrench"
          EXPECTED_REPOSITORY_ID: "1316443113"
          EXPECTED_VERSION: ${{ needs.verify.outputs.package_version }}
          EXPECTED_WORKFLOW_ID: "344213783"
          GH_TOKEN: ${{ github.token }}
          NPM_DIRECTORY: ${{ steps.npm_config.outputs.directory }}
          NPM_GLOBALCONFIG: ${{ steps.npm_config.outputs.globalconfig }}
          NPM_USERCONFIG: ${{ steps.npm_config.outputs.userconfig }}
          RESOLVED_STAGE_VERSION: ${{ inputs.resolved_stage_version }}
        run: |
          set -euo pipefail
          unset NPM_CONFIG_TAG npm_config_tag
          cd "$NPM_DIRECTORY"
          HISTORY_USER_CONFIG="$NPM_USERCONFIG" \
            HISTORY_GLOBAL_CONFIG="$NPM_GLOBALCONFIG" node <<'NODE'
          const { spawnSync } = require("node:child_process");
          const expectedName = "@hraness/wrench";
          const expectedRepository = process.env.EXPECTED_REPOSITORY ?? "";
          const expectedVersion = process.env.EXPECTED_VERSION ?? "";
          const workflowId = process.env.EXPECTED_WORKFLOW_ID ?? "";
          const repositoryId = process.env.EXPECTED_REPOSITORY_ID ?? "";
          const repository = process.env.GITHUB_REPOSITORY ?? "";
          const currentRunId = process.env.GITHUB_RUN_ID ?? "";
          const currentSha = process.env.GITHUB_SHA ?? "";
          const resolvedStageVersion = process.env.RESOLVED_STAGE_VERSION ?? "";
          const userConfig = process.env.HISTORY_USER_CONFIG ?? "";
          const globalConfig = process.env.HISTORY_GLOBAL_CONFIG ?? "";
          const maximum = BigInt(Number.MAX_SAFE_INTEGER);
          const versionPattern = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/u;
          const parseVersion = (value, label) => {
            if (typeof value !== "string") throw new Error(`${label} is not a string`);
            const match = versionPattern.exec(value);
            if (match === null) throw new Error(`${label} is not a stable semantic version`);
            const parts = match.slice(1).map(BigInt);
            if (parts.some(part => part > maximum)) {
              throw new Error(`${label} exceeds Number.MAX_SAFE_INTEGER`);
            }
            return parts;
          };
          const compare = (left, right) => {
            for (let index = 0; index < 3; index += 1) {
              if (left[index] !== right[index]) return left[index] > right[index] ? 1 : -1;
            }
            return 0;
          };
          const execute = (command, args, label) => {
            const result = spawnSync(command, args, {
              encoding: "utf8",
              maxBuffer: 10 * 1024 * 1024,
            });
            if (result.status !== 0 || result.error) throw new Error(`Could not read ${label}`);
            return result.stdout;
          };
          const positiveSafeInteger = (value, label) => {
            if (!/^[1-9][0-9]*$/u.test(value)) throw new Error(`Invalid ${label}`);
            const number = Number(value);
            if (!Number.isSafeInteger(number)) throw new Error(`Unsafe ${label}`);
            return number;
          };
          const workflowNumber = positiveSafeInteger(workflowId, "workflow id");
          const repositoryNumber = positiveSafeInteger(repositoryId, "repository id");
          const currentRunNumber = positiveSafeInteger(currentRunId, "current run id");
          if (
            repository !== expectedRepository
            || expectedRepository !== "hraness/wrench"
            || !/^[a-f0-9]{40}$/u.test(currentSha)
            || userConfig === ""
            || globalConfig === ""
          ) throw new Error("Stable-stage history identity is invalid");
          const current = parseVersion(expectedVersion, "Candidate version");
          const resolved = resolvedStageVersion === ""
            ? null
            : parseVersion(resolvedStageVersion, "Resolved prior stage version");
          const configuredTag = execute("npm", [
            "config", "get", "tag",
            `--globalconfig=${globalConfig}`,
            `--userconfig=${userConfig}`,
          ], "clean npm default tag").trim();
          if (configuredTag !== "latest") throw new Error("Clean npm publication default moved before history inspection");
          const latestValue = JSON.parse(execute("npm", [
            "view",
            expectedName,
            "dist-tags.latest",
            "--json",
            `--globalconfig=${globalConfig}`,
            "--registry=https://registry.npmjs.org",
            `--userconfig=${userConfig}`,
          ], "npm latest"));
          const latest = parseVersion(latestValue, "Public npm latest");
          if (compare(current, latest) <= 0) {
            throw new Error(`Candidate ${expectedVersion} is not newer than public npm latest ${latestValue}`);
          }
          const intentRuns = new Map();
          const resolutionCounts = new Map();
          const seenJobIds = new Set();
          const legacyGenericStages = new Map([
            [33134350359, { jobId: 98736138383, runAttempt: 1, sha: "59724c9b8d660dc082989f154ee4e98c502df612", version: "0.16.0" }],
            [33144248535, { jobId: 98768005663, runAttempt: 1, sha: "12fde2af132b924f10664f249c924314c9d4ae9b", version: "0.16.1" }],
            [33236415013, { jobId: 99062211048, runAttempt: 1, sha: "33309c470336127228b959e2aaa54138247b9684", version: "0.16.2" }],
            [33715165834, { jobId: 100531488173, runAttempt: 1, sha: "c2d956ca4102d38c29e24ca4e13f26ce862b47f3", version: "0.16.3" }],
            [33832566262, { jobId: 100906143000, runAttempt: 1, sha: "05e6a3e7a19e34b2f1611357a3b124467b5a8977", version: "0.16.4" }],
            [33920809926, { jobId: 101188893427, runAttempt: 1, sha: "745ed522873c2e5d14537719d8dc74ac6bf2d70f", version: "0.16.5" }],
            [33980252754, {
              jobId: 101350099282,
              runAttempt: 1,
              sha: "2292db1323e2d1a1c94e2fb7d8731b0c8ce97fc2",
              terminalStepName: "Revalidate protected-main ancestry and stage exact package",
              terminalStepNumber: 7,
              version: "0.16.6",
            }],
          ]);
          const increment = (map, version) => map.set(version, (map.get(version) ?? 0) + 1);
          const inspectRunJobs = (runId, expectedSha, completedRun) => {
            const jobsPayload = JSON.parse(execute("gh", [
              "api",
              "--method", "GET",
              `/repos/${repository}/actions/runs/${runId}/jobs?filter=all&per_page=100`,
            ], `jobs for npm-stage run ${runId}`));
            if (
              !jobsPayload
              || typeof jobsPayload !== "object"
              || !Number.isSafeInteger(jobsPayload.total_count)
              || jobsPayload.total_count < 0
              || jobsPayload.total_count > 100
              || !Array.isArray(jobsPayload.jobs)
              || jobsPayload.jobs.length !== jobsPayload.total_count
