[package]
name = "ghostget-desktop"
version = "0.18.3"
description = "Native local control panel for Ghostget"
authors = ["Ghostget contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
desktop-foundation = { git = "https://github.com/hraness/desktop-foundation", tag = "v0.4.0" }
tauri = { version = "=2.11.5", features = ["tray-icon"] }
serde_json = "1.0"
libc = "0.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
