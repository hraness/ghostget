[package]
name = "ghostget-desktop"
version = "0.19.0"
description = "Native local control panel for Ghostget"
authors = ["Ghostget contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
serde_json = "1.0"
libc = "0.2"
serde = { version = "=1.0.229", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSAlert", "NSApplication", "NSButton", "NSControl", "NSSecureTextField", "NSTextField", "NSView", "NSWindow"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSGeometry", "NSString"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
